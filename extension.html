<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 2px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: transparent;
    font-size: 12px;
}

.ext-container {
    background: #ffffff;
    padding: 3px;
    border-radius: 6px;
    box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    border: 1px solid #e2e8f0;
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th, td {
    border: 1px solid #e2e8f0;
    padding: 3px 1px;
    text-align: center;
    overflow: hidden;
    height: 26px;
}

th {
    background-color: #f1f5f9;
    font-size: 9px;
    font-weight: 700;
    color: #475569;
    text-transform: uppercase;
}

th.key-header {
    cursor: pointer;
    user-select: none;
    font-size: 12px;
}

/* Column Width Specifications */
.col-name { width: 20%; }
.col-num  { width: 10%; }
.col-amt  { width: 20%; }

input {
    width: 100%;
    height: 100%;
    padding: 1px;
    text-align: center;
    border: 1px solid transparent;
    border-radius: 2px;
    font-size: 11px;
    background-color: transparent;
}

input:focus {
    outline: none;
    border-color: #3b82f6;
    background-color: #fff;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
}

input[readonly] {
    background-color: transparent;
    color: #334155;
}

/* Active Row Highlighting */
tr.active-row td {
    background-color: #eff6ff !important;
    border-color: #bfdbfe;
}

tr.active-row input {
    color: #1d4ed8;
    font-weight: 600;
}
</style>
</head>
<body>

<div class="ext-container">
    <table id="extTable">
        <tr>
            <th class="col-name key-header" onclick="handleKeyTap()" title="Tap 3 times to unlock/lock name column">🔑</th>
            <th class="col-num">Dry</th>
            <th class="col-num">Fresh</th>
            <th class="col-num">Cab</th>
            <th class="col-num">BO</th>
            <th class="col-num">Payment</th>
            <th class="col-num">Bal</th>
            <th class="col-amt">Amount</th>
        </tr>
        <!-- Rows will be dynamically generated by JS (17 Data Rows) -->
    </table>
</div>

<script>
let keyTapCount = 0;
let keyTapTimer = null;
let isNameUnlocked = false;
let activeRowIndex = 0; // Default to first data row

const TOTAL_ROWS = 17;

window.onload = function() {
    buildTable();
    loadRowData(activeRowIndex);
    
    // Listen to parent changes
    window.addEventListener('storage', (e) => {
        if (e.key && e.key.startsWith('ext_row_')) {
            // Sync current active row inputs if changed externally
            updateActiveRowFromInputs();
        }
    });
};

function buildTable() {
    let table = document.getElementById('extTable');
    let html = `<tr>
        <th class="col-name key-header" onclick="handleKeyTap()" title="Tap 3 times to unlock/lock name column">🔑</th>
        <th class="col-num">Dry</th>
        <th class="col-num">Fresh</th>
        <th class="col-num">Cab</th>
        <th class="col-num">BO</th>
        <th class="col-num">Payment</th>
        <th class="col-num">Bal</th>
        <th class="col-amt">Amount</th>
    </tr>`;

    for (let i = 0; i < TOTAL_ROWS; i++) {
        html += `<tr id="row_${i}" onclick="selectRow(${i})">
            <td><input type="text" id="name_${i}" value="Client ${i+1}" readonly oninput="saveRow(${i})"></td>
            <td><input type="number" id="dry_${i}" readonly oninput="saveRow(${i})"></td>
            <td><input type="number" id="fresh_${i}" readonly oninput="saveRow(${i})"></td>
            <td><input type="number" id="cab_${i}" readonly oninput="saveRow(${i})"></td>
            <td><input type="number" id="bo_${i}" readonly oninput="saveRow(${i})"></td>
            <td><input type="number" id="payment_${i}" readonly oninput="saveRow(${i})"></td>
            <td><input type="number" id="bal_${i}" readonly oninput="saveRow(${i})"></td>
            <td><input type="text" id="amt_${i}" readonly style="font-weight:700; color:#dc2626;"></td>
        </tr>`;
    }
    table.innerHTML = html;
}

function handleKeyTap() {
    keyTapCount++;
    clearTimeout(keyTapTimer);
    if (keyTapCount >= 3) {
        toggleNameLock();
        keyTapCount = 0;
    } else {
        keyTapTimer = setTimeout(() => { keyTapCount = 0; }, 600);
    }
}

function toggleNameLock() {
    isNameUnlocked = !isNameUnlocked;
    for (let i = 0; i < TOTAL_ROWS; i++) {
        let input = document.getElementById(`name_${i}`);
        if (input) {
            if (isNameUnlocked) input.removeAttribute('readonly');
            else input.setAttribute('readonly', 'readonly');
        }
    }
    let header = document.querySelector('.key-header');
    if (header) header.style.backgroundColor = isNameUnlocked ? '#fef08a' : '#f1f5f9';
}

function selectRow(index) {
    if (activeRowIndex === index) return;
    
    // Save current active row data before leaving
    saveRow(activeRowIndex);
    
    // Switch active row
    activeRowIndex = index;
    highlightActiveRow();
    loadRowData(activeRowIndex);
}

function highlightActiveRow() {
    for (let i = 0; i < TOTAL_ROWS; i++) {
        let tr = document.getElementById(`row_${i}`);
        if (tr) {
            if (i === activeRowIndex) tr.classList.add('active-row');
            else tr.classList.remove('active-row');
        }
    }
}

function saveRow(index) {
    // Save row data to localStorage so main app or persistence works
    let data = {
        name: document.getElementById(`name_${index}`).value,
        dry: document.getElementById(`dry_${index}`).value,
        fresh: document.getElementById(`fresh_${index}`).value,
        cab: document.getElementById(`cab_${index}`).value,
        bo: document.getElementById(`bo_${index}`).value,
        payment: document.getElementById(`payment_${index}`).value,
        bal: document.getElementById(`bal_${index}`).value
    };
    localStorage.setItem(`ext_row_${index}`, JSON.stringify(data));
}

function loadRowData(index) {
    let saved = localStorage.getItem(`ext_row_${index}`);
    if (saved) {
        try {
            let data = JSON.parse(saved);
            document.getElementById(`name_${index}`).value = data.name || `Client ${index+1}`;
            document.getElementById(`dry_${index}`).value = data.dry || '';
            document.getElementById(`fresh_${index}`).value = data.fresh || '';
            document.getElementById(`cab_${index}`).value = data.cab || '';
            document.getElementById(`bo_${index}`).value = data.bo || '';
            document.getElementById(`payment_${index}`).value = data.payment || '';
            document.getElementById(`bal_${index}`).value = data.bal || '';
        } catch(e) {}
    }
    highlightActiveRow();
}
</script>

</body>
</html>
