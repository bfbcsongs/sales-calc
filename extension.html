<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 2px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: transparent;
    font-size: 12px;
}
.ext-container {
    background: #ffffff;
    padding: 3px;
    border-radius: 6px;
    box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    border: 1px solid #e2e8f0;
    width: 100%;
    overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td { border: 1px solid #e2e8f0; padding: 3px 1px; text-align: center; overflow: hidden; height: 26px; }
th { background-color: #f1f5f9; font-size: 9px; font-weight: 700; color: #475569; text-transform: uppercase; }
th.key-header { cursor: pointer; user-select: none; font-size: 11px; }
.col-name { width: 20%; }
.col-num  { width: 10%; }
.col-amt  { width: 20%; }
input {
    width: 100%; height: 100%; padding: 1px; text-align: center;
    border: 1px solid transparent; border-radius: 2px; font-size: 11px; background-color: transparent;
}
input:focus { outline: none; border-color: #3b82f6; background-color: #fff; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15); }
input[readonly] { background-color: transparent; color: #334155; }
tr.active-row td { background-color: #eff6ff !important; border-color: #bfdbfe; }
tr.active-row input { color: #1d4ed8; font-weight: 600; }

/* Kulay red kapag naka-lock ang row */
tr.locked-row td { background-color: #fef2f2 !important; border-color: #fecaca !important; }
tr.locked-row input { color: #dc2626 !important; font-weight: 600; }

tr.total-row td { background-color: #fef2f2 !important; font-weight: 700; color: #dc2626; }
tr.total-row input { color: #dc2626; font-weight: 700; }
</style>
</head>
<body>

<div class="ext-container">
    <table id="extTable"></table>
</div>

<script>
let isNameUnlocked = false;
let keyTapCount = 0; let keyTimer = null;
let activeRowIndex = parseInt(localStorage.getItem('ext_active_row')) || 0; 
let lockedRows = {}; 
const TOTAL_ROWS = 17;

window.onload = function() {
    buildTable();
    loadRowData(activeRowIndex);
    setInterval(syncWithMainApp, 300);

    window.addEventListener('message', function(e) {
        if (e.data === 'toggleOpenAll') {
            toggleAllRowsLock();
        } else if (e.data === 'clearAllRows') {
            clearAllRowsConfirmed();
        }
    });
};

function buildTable() {
    let table = document.getElementById('extTable');
    let html = `<tr>
        <th class="col-name key-header" onclick="handleKeyTap()" title="3 taps to unlock names">🔑 NAME</th>
        <th class="col-num">Dry</th>
        <th class="col-num">Fresh</th>
        <th class="col-num">Cab</th>
        <th class="col-num">BO</th>
        <th class="col-num">Payment</th>
        <th class="col-num">Bal</th>
        <th class="col-amt">Amount</th>
    </tr>`;

    for (let i = 0; i < TOTAL_ROWS; i++) {
        let isTotalRow = (i === TOTAL_ROWS - 1);
        if (isTotalRow) {
            html += `<tr id="row_${i}" class="total-row">
                <td><input type="text" id="name_${i}" value="TOTAL" readonly></td>
                <td><input type="text" id="dry_${i}" readonly></td>
                <td><input type="text" id="fresh_${i}" readonly></td>
                <td><input type="text" id="cab_${i}" readonly></td>
                <td><input type="text" id="bo_${i}" readonly></td>
                <td><input type="text" id="payment_${i}" readonly></td>
                <td><input type="text" id="bal_${i}" readonly></td>
                <td><input type="text" id="amt_${i}" readonly style="font-weight:700; color:#dc2626;"></td>
            </tr>`;
        } else {
            html += `<tr id="row_${i}" onclick="handleRowClick(${i}, event)">
                <td><input type="text" id="name_${i}" value="Client ${i+1}" readonly oninput="saveRow(${i})"></td>
                <td><input type="number" id="dry_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="fresh_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="cab_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="bo_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="payment_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="bal_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="text" id="amt_${i}" readonly style="font-weight:700; color:#dc2626;"></td>
            </tr>`;
        }
    }
    table.innerHTML = html;
}

function handleRowClick(index, event) {
    if (index === TOTAL_ROWS - 1) return;
    
    let target = event.target;
    if (target.id.startsWith('name_')) {
        toggleRowLock(index);
    } else {
        selectRow(index);
    }
}

function toggleRowLock(index) {
    if (lockedRows[index]) {
        delete lockedRows[index];
    } else {
        lockedRows[index] = true;
        saveRow(index);
    }
    updateRowVisuals(index);
    calculateGrandTotals();
}

function updateRowVisuals(index) {
    let tr = document.getElementById(`row_${index}`);
    if (!tr) return;
    
    let isLocked = lockedRows[index];
    let nameInput = document.getElementById(`name_${index}`);
    
    if (isLocked) {
        tr.classList.add('locked-row');
        tr.classList.remove('active-row');
        ['dry', 'fresh', 'cab', 'bo', 'payment', 'bal'].forEach(field => {
            let el = document.getElementById(`${field}_${index}`);
            if (el) el.setAttribute('readonly', 'readonly');
        });
        if (nameInput) {
            let cleanName = nameInput.value.replace('🔒 ', '');
            nameInput.value = '🔒 ' + cleanName;
        }
    } else {
        tr.classList.remove('locked-row');
        if (nameInput) {
            nameInput.value = nameInput.value.replace('🔒 ', '');
        }
        if (index === activeRowIndex) {
            tr.classList.add('active-row');
            ['dry', 'fresh', 'cab', 'bo', 'payment', 'bal'].forEach(field => {
                let el = document.getElementById(`${field}_${index}`);
                if (el) el.removeAttribute('readonly');
            });
        }
    }
}

function handleKeyTap() {
    keyTapCount++;
    clearTimeout(keyTimer);
    if (keyTapCount >= 3) {
        toggleNameLock();
        keyTapCount = 0;
    } else {
        keyTimer = setTimeout(() => { keyTapCount = 0; }, 600);
    }
}

function toggleNameLock() {
    isNameUnlocked = !isNameUnlocked;
    for (let i = 0; i < TOTAL_ROWS - 1; i++) {
        let input = document.getElementById(`name_${i}`);
        if (input && !lockedRows[i]) {
            if (isNameUnlocked) input.removeAttribute('readonly');
            else input.setAttribute('readonly', 'readonly');
        }
    }
    let header = document.querySelector('.key-header');
    if (header) header.style.backgroundColor = isNameUnlocked ? '#fef08a' : '#f1f5f9';
}

function toggleAllRowsLock() {
    let anyLocked = Object.keys(lockedRows).length > 0;
    for (let i = 0; i < TOTAL_ROWS - 1; i++) {
        if (!anyLocked) lockedRows[i] = true;
        else delete lockedRows[i];
        updateRowVisuals(i);
    }
    calculateGrandTotals();
}

function clearAllRowsConfirmed() {
    if (confirm('Sigurado ka bang i-clear ang lahat ng rows?')) {
        for (let i = 0; i < TOTAL_ROWS - 1; i++) {
            localStorage.removeItem(`ext_row_${i}`);
            delete lockedRows[i];
        }
        activeRowIndex = 0;
        localStorage.setItem('ext_active_row', activeRowIndex);
        loadRowData(activeRowIndex);
        calculateGrandTotals();
        clearMainCalculator();
    }
}

function selectRow(index) {
    if (index === TOTAL_ROWS - 1) return;
    if (lockedRows[index]) return; // Kung naka-lock, bawal galawin
    if (activeRowIndex === index) return;
    
    saveRow(activeRowIndex);
    
    activeRowIndex = index;
    localStorage.setItem('ext_active_row', activeRowIndex);
    
    highlightActiveRow();
    loadRowData(activeRowIndex);
    loadValuesIntoMainCalculator(activeRowIndex);
}

function loadValuesIntoMainCalculator(index) {
    let getVal = (field) => {
        let el = document.getElementById(`${field}_${index}`);
        return el ? el.value : '';
    };
    
    ['dry', 'fresh', 'cab', 'bo', 'payment', 'bal'].forEach(field => {
        let val = getVal(field);
        localStorage.setItem('order_qty_' + field, val);
        if(field === 'payment' || field === 'bal') {
            localStorage.setItem('order_' + field, val);
        }
        
        let parentEl = parent.document.getElementById(field === 'payment' || field === 'bal' ? field : 'qty_' + field);
        if (parentEl) parentEl.value = val;
        
        let quickEl = parent.document.getElementById('quick_' + (field === 'payment' || field === 'bal' ? field : 'qty_' + field));
        if (quickEl) quickEl.value = val;
    });

    let parentCalc = parent.window.calculate;
    if (typeof parentCalc === 'function') parentCalc();
}

function clearMainCalculator() {
    ['qty_dry', 'qty_fresh', 'qty_cab', 'qty_bo', 'payment', 'bal'].forEach(id => {
        localStorage.removeItem('order_' + id);
        let el = parent.document.getElementById(id);
        if (el) el.value = '';
        let quickEl = parent.document.getElementById('quick_' + id);
        if (quickEl) quickEl.value = '';
    });
    let parentCalc = parent.window.calculate;
    if (typeof parentCalc === 'function') parentCalc();
}

function highlightActiveRow() {
    for (let i = 0; i < TOTAL_ROWS; i++) {
        let tr = document.getElementById(`row_${i}`);
        if (tr && i !== TOTAL_ROWS - 1) {
            if (i === activeRowIndex && !lockedRows[i]) tr.classList.add('active-row');
            else if (!lockedRows[i]) tr.classList.remove('active-row');
        }
    }
}

function onFieldInput(index) {
    if (lockedRows[index]) return;
    calculateRowAmount(index);
    saveRow(index);
    calculateGrandTotals();
}

function calculateRowAmount(index) {
    let getVal = (id) => {
        let el = document.getElementById(id);
        return el && el.value !== '' ? parseFloat(el.value) || 0 : 0;
    };
    let dry = getVal(`dry_${index}`);
    let fresh = getVal(`fresh_${index}`);
    let cab = getVal(`cab_${index}`);
    let bo = getVal(`bo_${index}`);
    let payment = getVal(`payment_${index}`);
    let bal = getVal(`bal_${index}`);
    
    let subTotal = (dry * 45) + (fresh * 45) + (cab * 40) - ((bo / 2) * 45);
    let totalAmt = subTotal - payment + bal;
    
    let amtEl = document.getElementById(`amt_${index}`);
    if (amtEl) amtEl.value = totalAmt !== 0 ? Math.round(totalAmt).toLocaleString() : '';
}

function saveRow(index) {
    let nameVal = document.getElementById(`name_${index}`).value.replace('🔒 ', '');
    let data = {
        name: nameVal,
        dry: document.getElementById(`dry_${index}`).value,
        fresh: document.getElementById(`fresh_${index}`).value,
        cab: document.getElementById(`cab_${index}`).value,
        bo: document.getElementById(`bo_${index}`).value,
        payment: document.getElementById(`payment_${index}`).value,
        bal: document.getElementById(`bal_${index}`).value,
        locked: !!lockedRows[index]
    };
    localStorage.setItem(`ext_row_${index}`, JSON.stringify(data));
}

function loadRowData(index) {
    let saved = localStorage.getItem(`ext_row_${index}`);
    if (saved) {
        try {
            let data = JSON.parse(saved);
            if (data.locked) lockedRows[index] = true;
            
            let nInput = document.getElementById(`name_${index}`);
            nInput.value = (lockedRows[index] ? '🔒 ' : '') + (data.name || `Client ${index+1}`);
            document.getElementById(`dry_${index}`).value = data.dry || '';
            document.getElementById(`fresh_${index}`).value = data.fresh || '';
            document.getElementById(`cab_${index}`).value = data.cab || '';
            document.getElementById(`bo_${index}`).value = data.bo || '';
            document.getElementById(`payment_${index}`).value = data.payment || '';
            document.getElementById(`bal_${index}`).value = data.bal || '';
        } catch(e) {}
    } else {
        let nInput = document.getElementById(`name_${index}`);
        nInput.value = (lockedRows[index] ? '🔒 ' : '') + `Client ${index+1}`;
        document.getElementById(`dry_${index}`).value = '';
        document.getElementById(`fresh_${index}`).value = '';
        document.getElementById(`cab_${index}`).value = '';
        document.getElementById(`bo_${index}`).value = '';
        document.getElementById(`payment_${index}`).value = '';
        document.getElementById(`bal_${index}`).value = '';
    }
    
    updateRowVisuals(index);
    calculateRowAmount(index);
    calculateGrandTotals();
}

function syncWithMainApp() {
    if (lockedRows[activeRowIndex]) return;

    let mDry = localStorage.getItem('order_qty_dry') || '';
    let mFresh = localStorage.getItem('order_qty_fresh') || '';
    let mCab = localStorage.getItem('order_qty_cab') || '';
    let mBo = localStorage.getItem('order_qty_bo') || '';
    let mPayment = localStorage.getItem('order_payment') || '';
    let mBal = localStorage.getItem('order_bal') || '';

    let dEl = document.getElementById(`dry_${activeRowIndex}`);
    if (dEl && document.activeElement !== dEl) {
        // Tinitiyak natin na ang kasalukuyang active row lang ang binabago ng sync
        if (dEl.value !== mDry || document.getElementById(`fresh_${activeRowIndex}`).value !== mFresh ||
            document.getElementById(`cab_${activeRowIndex}`).value !== mCab || document.getElementById(`bo_${activeRowIndex}`).value !== mBo ||
            document.getElementById(`payment_${activeRowIndex}`).value !== mPayment || document.getElementById(`bal_${activeRowIndex}`).value !== mBal) {
            
            dEl.value = mDry;
            document.getElementById(`fresh_${activeRowIndex}`).value = mFresh;
            document.getElementById(`cab_${activeRowIndex}`).value = mCab;
            document.getElementById(`bo_${activeRowIndex}`).value = mBo;
            document.getElementById(`payment_${activeRowIndex}`).value = mPayment;
            document.getElementById(`bal_${activeRowIndex}`).value = mBal;
            
            calculateRowAmount(activeRowIndex);
            saveRow(activeRowIndex);
            calculateGrandTotals();
        }
    }
}

function calculateGrandTotals() {
    let tAmt = 0, tDry = 0, tFresh = 0, tCab = 0, tBo = 0, tPayment = 0, tBal = 0;
    for (let i = 0; i < TOTAL_ROWS - 1; i++) {
        let getVal = (id) => {
            let el = document.getElementById(id);
            return el && el.value !== '' ? parseFloat(el.value.replace(/,/g, '').replace('🔒 ', '')) || 0 : 0;
        };
        tDry += getVal(`dry_${i}`);
        tFresh += getVal(`fresh_${i}`);
        tCab += getVal(`cab_${i}`);
        tBo += getVal(`bo_${i}`);
        tPayment += getVal(`payment_${i}`);
        tBal += getVal(`bal_${i}`);
        tAmt += getVal(`amt_${i}`);
    }
    let tIndex = TOTAL_ROWS - 1;
    let setT = (id, val) => {
        let el = document.getElementById(`${id}_${tIndex}`);
        if (el) el.value = val !== 0 ? Math.round(val).toLocaleString() : '';
    };
    setT('dry', tDry);
    setT('fresh', tFresh);
    setT('cab', tCab);
    setT('bo', tBo);
    setT('payment', tPayment);
    setT('bal', tBal);
    setT('amt', tAmt);
}
</script>
</body>
</html>
