<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 2px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: transparent;
    font-size: 12px;
}
.ext-container {
    background: #ffffff;
    padding: 3px;
    border-radius: 6px;
    box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    border: 1px solid #e2e8f0;
    width: 100%;
    overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td { border: 1px solid #e2e8f0; padding: 3px 1px; text-align: center; overflow: hidden; height: 26px; }
th { background-color: #f1f5f9; font-size: 9px; font-weight: 700; color: #475569; text-transform: uppercase; }
th.key-header { cursor: pointer; user-select: none; font-size: 11px; }
.col-name { width: 20%; }
.col-num  { width: 10%; }
.col-amt  { width: 20%; }
input {
    width: 100%; height: 100%; padding: 1px; text-align: center;
    border: 1px solid transparent; border-radius: 2px; font-size: 11px; background-color: transparent;
}
input:focus { outline: none; border-color: #3b82f6; background-color: #fff; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15); }
input[readonly] { background-color: transparent; color: #334155; }
tr.active-row td { background-color: #eff6ff !important; border-color: #bfdbfe; }
tr.active-row input { color: #1d4ed8; font-weight: 600; }

tr.total-row td { background-color: #fef2f2 !important; font-weight: 700; color: #dc2626; }
tr.total-row input { color: #dc2626; font-weight: 700; }
</style>
</head>
<body>

<div class="ext-container">
    <table id="extTable"></table>
</div>

<script>
const TOTAL_ROWS = 17;
let activeRowIndex = 0;
try {
    let savedRow = localStorage.getItem('ext_active_row');
    if (savedRow !== null && !isNaN(savedRow)) {
        activeRowIndex = parseInt(savedRow);
    }
} catch(e) {
    activeRowIndex = 0;
}
let isNameUnlocked = false;
let keyTapCount = 0; 
let keyTimer = null;
window.onload = function() {
    buildTable();
    loadAllRowsData();
    selectRow(activeRowIndex, false);

    // Live sync sa active row (Per Row Sync)
    setInterval(syncActiveRowData, 200);
};

function buildTable() {
    let table = document.getElementById('extTable');
    let html = `<tr>
        <th class="col-name key-header" onclick="handleKeyTap()" title="5 taps to unlock names">🔑 NAME</th>
        <th class="col-num">Dry</th>
        <th class="col-num">Fresh</th>
        <th class="col-num">Cab</th>
        <th class="col-num">BO</th>
        <th class="col-num">Payment</th>
        <th class="col-num">Bal</th>
        <th class="col-amt">Amount</th>
    </tr>`;

    for (let i = 0; i < TOTAL_ROWS; i++) {
        let isTotalRow = (i === TOTAL_ROWS - 1);
        if (isTotalRow) {
            html += `<tr id="row_${i}" class="total-row">
                <td><input type="text" id="name_${i}" value="TOTAL" readonly></td>
                <td><input type="text" id="dry_${i}" readonly></td>
                <td><input type="text" id="fresh_${i}" readonly></td>
                <td><input type="text" id="cab_${i}" readonly></td>
                <td><input type="text" id="bo_${i}" readonly></td>
                <td><input type="text" id="payment_${i}" readonly></td>
                <td><input type="text" id="bal_${i}" readonly></td>
                <td><input type="text" id="amt_${i}" readonly style="font-weight:700; color:#dc2626;"></td>
            </tr>`;
        } else {
            html += `<tr id="row_${i}" onclick="selectRow(${i}, true)">
                <td><input type="text" id="name_${i}" value="Client ${i+1}" ${isNameUnlocked ? '' : 'readonly'} oninput="saveRow(${i})"></td>
                <td><input type="number" id="dry_${i}" readonly></td>
                <td><input type="number" id="fresh_${i}" readonly></td>
                <td><input type="number" id="cab_${i}" readonly></td>
                <td><input type="number" id="bo_${i}" readonly></td>
                <td><input type="number" id="payment_${i}" readonly></td>
                <td><input type="number" id="bal_${i}" readonly></td>
                <td><input type="text" id="amt_${i}" readonly style="font-weight:700; color:#dc2626;"></td>
            </tr>`;
        }
    }
    table.innerHTML = html;
}

function handleKeyTap() {
    keyTapCount++;
    clearTimeout(keyTimer);
    if (keyTapCount >= 5) { // 5 taps para mag-unlock ang names
        toggleNameLock();
        keyTapCount = 0;
    } else {
        keyTimer = setTimeout(() => { keyTapCount = 0; }, 600);
    }
}

function toggleNameLock() {
    isNameUnlocked = !isNameUnlocked;
    for (let i = 0; i < TOTAL_ROWS - 1; i++) {
        let input = document.getElementById(`name_${i}`);
        if (input) {
            if (isNameUnlocked) input.removeAttribute('readonly');
            else input.setAttribute('readonly', 'readonly');
        }
    }
    let header = document.querySelector('.key-header');
    if (header) header.style.backgroundColor = isNameUnlocked ? '#fef08a' : '#f1f5f9';
}

function selectRow(index, loadToMain = true) {
    if (index === TOTAL_ROWS - 1) return;
    
    // Save muna ang data ng dating active row bago lumipat
    saveRow(activeRowIndex);
    
    activeRowIndex = index;
    localStorage.setItem('ext_active_row', activeRowIndex);
    
    highlightActiveRow();
    
    if (loadToMain) {
        loadValuesIntoMainCalculator(activeRowIndex);
    }
}

function highlightActiveRow() {
    for (let i = 0; i < TOTAL_ROWS - 1; i++) {
        let tr = document.getElementById(`row_${i}`);
        if (tr) {
            if (i === activeRowIndex) tr.classList.add('active-row');
            else tr.classList.remove('active-row');
        }
    }
}

function loadValuesIntoMainCalculator(index) {
    let getVal = (field) => {
        let el = document.getElementById(`${field}_${index}`);
        return el ? el.value : '';
    };
    
    // I-load ang values ng piniling row papunta sa main table / local storage ng main app
    let mFields = ['dry', 'fresh', 'cab', 'bo', 'payment', 'bal'];
    mFields.forEach(field => {
        let val = getVal(field);
        let storageKey = (field === 'payment' || field === 'bal') ? 'order_' + field : 'order_qty_' + field;
        localStorage.setItem(storageKey, val);
        
        let parentElId = (field === 'payment' || field === 'bal') ? field : 'qty_' + field;
        let parentEl = parent.document.getElementById(parentElId);
        if (parentEl) parentEl.value = val;
        
        let quickEl = parent.document.getElementById('quick_' + parentElId);
        if (quickEl) quickEl.value = val;
    });

    let parentCalc = parent.window.calculate;
    if (typeof parentCalc === 'function') parentCalc();
}

function saveRow(index) {
    if (index < 0 || index >= TOTAL_ROWS - 1) return;
    let nameInput = document.getElementById(`name_${index}`);
    if (!nameInput) return;
    
    let data = {
        name: nameInput.value,
        dry: document.getElementById(`dry_${index}`).value,
        fresh: document.getElementById(`fresh_${index}`).value,
        cab: document.getElementById(`cab_${index}`).value,
        bo: document.getElementById(`bo_${index}`).value,
        payment: document.getElementById(`payment_${index}`).value,
        bal: document.getElementById(`bal_${index}`).value
    };
    localStorage.setItem(`ext_row_${index}`, JSON.stringify(data));
}

function loadAllRowsData() {
    for (let i = 0; i < TOTAL_ROWS - 1; i++) {
        let saved = localStorage.getItem(`ext_row_${i}`);
        if (saved) {
            try {
                let data = JSON.parse(saved);
                let nInput = document.getElementById(`name_${i}`);
                if (nInput) nInput.value = data.name || `Client ${i+1}`;
                
                document.getElementById(`dry_${i}`).value = data.dry || '';
                document.getElementById(`fresh_${i}`).value = data.fresh || '';
                document.getElementById(`cab_${i}`).value = data.cab || '';
                document.getElementById(`bo_${i}`).value = data.bo || '';
                document.getElementById(`payment_${i}`).value = data.payment || '';
                document.getElementById(`bal_${i}`).value = data.bal || '';
            } catch(e) {}
        }
    }
    calculateGrandTotals();
}

function syncActiveRowData() {
    // Kunin ang current values mula sa main table storage
    let mDry = localStorage.getItem('order_qty_dry') || '';
    let mFresh = localStorage.getItem('order_qty_fresh') || '';
    let mCab = localStorage.getItem('order_qty_cab') || '';
    let mBo = localStorage.getItem('order_qty_bo') || '';
    let mPayment = localStorage.getItem('order_payment') || '';
    let mBal = localStorage.getItem('order_bal') || '';

    // Ilagay sa active row ng extension table nang per-row
    let setVal = (field, val) => {
        let el = document.getElementById(`${field}_${activeRowIndex}`);
        if (el && el.value !== val) {
            el.value = val;
        }
    };

    setVal('dry', mDry);
    setVal('fresh', mFresh);
    setVal('cab', mCab);
    setVal('bo', mBo);
    setVal('payment', mPayment);
    setVal('bal', mBal);

    // Kalkulahin ang Amount ng row na ito base sa Total ng main table o computation
    let mainTotalEl = parent.document.getElementById('total_amount') || parent.document.getElementById('grand_total') || parent.document.getElementById('total');
    
    // Kunin ang subtotal/amount computation para sa active row
    let dryNum = parseFloat(mDry) || 0;
    let freshNum = parseFloat(mFresh) || 0;
    let cabNum = parseFloat(mCab) || 0;
    let boNum = parseFloat(mBo) || 0;
    let payNum = parseFloat(mPayment) || 0;
    let balNum = parseFloat(mBal) || 0;

    let subTotal = (dryNum * 45) + (freshNum * 45) + (cabNum * 40) - ((boNum / 2) * 45);
    let totalAmt = subTotal - payNum + balNum;

    let amtEl = document.getElementById(`amt_${activeRowIndex}`);
    if (amtEl) {
        amtEl.value = totalAmt !== 0 ? Math.round(totalAmt).toLocaleString() : '';
    }

    saveRow(activeRowIndex);
    calculateGrandTotals();
}

function calculateGrandTotals() {
    let tAmt = 0, tDry = 0, tFresh = 0, tCab = 0, tBo = 0, tPayment = 0, tBal = 0;
    for (let i = 0; i < TOTAL_ROWS - 1; i++) {
        let getVal = (id) => {
            let el = document.getElementById(id);
            return el && el.value !== '' ? parseFloat(el.value.replace(/,/g, '')) || 0 : 0;
        };
        tDry += getVal(`dry_${i}`);
        tFresh += getVal(`fresh_${i}`);
        tCab += getVal(`cab_${i}`);
        tBo += getVal(`bo_${i}`);
        tPayment += getVal(`payment_${i}`);
        tBal += getVal(`bal_${i}`);
        
        let amtEl = document.getElementById(`amt_${i}`);
        if (amtEl && amtEl.value !== '') {
            tAmt += parseFloat(amtEl.value.replace(/,/g, '')) || 0;
        }
    }
    
    let tIndex = TOTAL_ROWS - 1;
    let setT = (id, val) => {
        let el = document.getElementById(`${id}_${tIndex}`);
        if (el) el.value = val !== 0 ? Math.round(val).toLocaleString() : '';
    };
    setT('dry', tDry);
    setT('fresh', tFresh);
    setT('cab', tCab);
    setT('bo', tBo);
    setT('payment', tPayment);
    setT('bal', tBal);
    setT('amt', tAmt);
}
</script>
</body>
</html>
