<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 2px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: transparent;
    font-size: 12px;
}
.ext-container {
    background: #ffffff;
    padding: 3px;
    border-radius: 6px;
    box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    border: 1px solid #e2e8f0;
    width: 100%;
    overflow-x: auto;
}
.action-bar {
    display: flex;
    justify-content: space-between;
    padding: 4px 2px;
    gap: 4px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    margin-bottom: 2px;
    border-radius: 4px;
}
.ctrl-btn {
    flex: 1;
    padding: 4px 6px;
    font-size: 10px;
    font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    text-align: center;
    border: 1px solid #cbd5e1;
}
.btn-open { background-color: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; }
.btn-clear { background-color: #fee2e2; color: #dc2626; border-color: #fecaca; }

table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td { border: 1px solid #e2e8f0; padding: 3px 1px; text-align: center; overflow: hidden; height: 26px; }
th { background-color: #f1f5f9; font-size: 9px; font-weight: 700; color: #475569; text-transform: uppercase; }
.col-name { width: 20%; }
.col-num  { width: 10%; }
.col-amt  { width: 20%; }
input {
    width: 100%; height: 100%; padding: 1px; text-align: center;
    border: 1px solid transparent; border-radius: 2px; font-size: 11px; background-color: transparent;
}
input:focus { outline: none; border-color: #3b82f6; background-color: #fff; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15); }
input[readonly] { background-color: transparent; color: #334155; }
tr.active-row td { background-color: #eff6ff !important; border-color: #bfdbfe; }
tr.active-row input { color: #1d4ed8; font-weight: 600; }
tr.total-row td { background-color: #fef2f2 !important; font-weight: 700; color: #dc2626; }
tr.total-row input { color: #dc2626; font-weight: 700; }
</style>
</head>
<body>

<div class="ext-container">
    <!-- Action Bar sa ibabaw ng table -->
    <div class="action-bar">
        <button class="ctrl-btn btn-open" onclick="toggleOpenAll()">📂 OPEN ALL</button>
        <button class="ctrl-btn btn-clear" onclick="clearAllWhenOpened()">🗑️ CLEAR</button>
    </div>
    <table id="extTable"></table>
</div>

<script>
let isAllOpen = false;
let activeRowIndex = 0; 
const TOTAL_ROWS = 17;

window.onload = function() {
    buildTable();
    loadRowData(activeRowIndex);
    setInterval(syncWithMainApp, 300);
};

function buildTable() {
    let table = document.getElementById('extTable');
    let html = `<tr>
        <th class="col-name">Name</th>
        <th class="col-num">Dry</th>
        <th class="col-num">Fresh</th>
        <th class="col-num">Cab</th>
        <th class="col-num">BO</th>
        <th class="col-num">Payment</th>
        <th class="col-num">Bal</th>
        <th class="col-amt">Amount</th>
    </tr>`;

    for (let i = 0; i < TOTAL_ROWS; i++) {
        let isTotalRow = (i === TOTAL_ROWS - 1);
        if (isTotalRow) {
            html += `<tr id="row_${i}" class="total-row">
                <td><input type="text" id="name_${i}" value="TOTAL" readonly></td>
                <td><input type="text" id="dry_${i}" readonly></td>
                <td><input type="text" id="fresh_${i}" readonly></td>
                <td><input type="text" id="cab_${i}" readonly></td>
                <td><input type="text" id="bo_${i}" readonly></td>
                <td><input type="text" id="payment_${i}" readonly></td>
                <td><input type="text" id="bal_${i}" readonly></td>
                <td><input type="text" id="amt_${i}" readonly style="font-weight:700; color:#dc2626;"></td>
            </tr>`;
        } else {
            html += `<tr id="row_${i}" onclick="selectRow(${i})">
                <td><input type="text" id="name_${i}" value="Client ${i+1}" readonly oninput="saveRow(${i})"></td>
                <td><input type="number" id="dry_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="fresh_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="cab_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="bo_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="payment_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="bal_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="text" id="amt_${i}" readonly style="font-weight:700; color:#dc2626;"></td>
            </tr>`;
        }
    }
    table.innerHTML = html;
}

function toggleOpenAll() {
    isAllOpen = !isAllOpen;
    let btn = document.querySelector('.btn-open');
    if (btn) {
        btn.style.backgroundColor = isAllOpen ? '#bbf7d0' : '#dbeafe';
        btn.style.color = isAllOpen ? '#166534' : '#1d4ed8';
        btn.textContent = isAllOpen ? '🔒 LOCK ALL' : '📂 OPEN ALL';
    }
    
    // Toggle readonly para sa lahat ng inputs maliban sa total row
    for (let i = 0; i < TOTAL_ROWS - 1; i++) {
        ['name', 'dry', 'fresh', 'cab', 'bo', 'payment', 'bal'].forEach(field => {
            let el = document.getElementById(`${field}_${i}`);
            if (el) {
                if (isAllOpen) el.removeAttribute('readonly');
                else el.setAttribute('readonly', 'readonly');
            }
        });
    }
}

function clearAllWhenOpened() {
    if (!isAllOpen) {
        alert('I-tap muna ang "OPEN ALL" bago i-clear ang mga rows.');
        return;
    }
    if (confirm('Sigurado ka bang gusto mong i-clear ang lahat ng rows?')) {
        for (let i = 0; i < TOTAL_ROWS - 1; i++) {
            localStorage.removeItem(`ext_row_${i}`);
        }
        loadRowData(activeRowIndex);
        calculateGrandTotals();
        clearMainCalculator();
    }
}

function selectRow(index) {
    if (index === TOTAL_ROWS - 1) return;
    if (activeRowIndex === index) return;
    
    saveRow(activeRowIndex);
    activeRowIndex = index;
    highlightActiveRow();
    loadRowData(activeRowIndex);
    
    // Auto-clear main calculator when leaving/switching row
    clearMainCalculator();
}

function clearMainCalculator() {
    localStorage.removeItem('order_qty_dry');
    localStorage.removeItem('order_qty_fresh');
    localStorage.removeItem('order_qty_cab');
    localStorage.removeItem('order_qty_bo');
    localStorage.removeItem('order_payment');
    localStorage.removeItem('order_bal');
}

function highlightActiveRow() {
    for (let i = 0; i < TOTAL_ROWS; i++) {
        let tr = document.getElementById(`row_${i}`);
        if (tr && i !== TOTAL_ROWS - 1) {
            if (i === activeRowIndex) tr.classList.add('active-row');
            else tr.classList.remove('active-row');
        }
    }
}

function onFieldInput(index) {
    calculateRowAmount(index);
    saveRow(index);
    calculateGrandTotals();
}

function calculateRowAmount(index) {
    let getVal = (id) => {
        let el = document.getElementById(id);
        return el && el.value !== '' ? parseFloat(el.value) || 0 : 0;
    };
    let dry = getVal(`dry_${index}`);
    let fresh = getVal(`fresh_${index}`);
    let cab = getVal(`cab_${index}`);
    let bo = getVal(`bo_${index}`);
    let payment = getVal(`payment_${index}`);
    let bal = getVal(`bal_${index}`);
    
    let subTotal = (dry * 45) + (fresh * 45) + (cab * 40) - ((bo / 2) * 45);
    let totalAmt = subTotal - payment + bal;
    
    let amtEl = document.getElementById(`amt_${index}`);
    if (amtEl) amtEl.value = totalAmt !== 0 ? Math.round(totalAmt).toLocaleString() : '';
}

function saveRow(index) {
    let data = {
        name: document.getElementById(`name_${index}`).value,
        dry: document.getElementById(`dry_${index}`).value,
        fresh: document.getElementById(`fresh_${index}`).value,
        cab: document.getElementById(`cab_${index}`).value,
        bo: document.getElementById(`bo_${index}`).value,
        payment: document.getElementById(`payment_${index}`).value,
        bal: document.getElementById(`bal_${index}`).value
    };
    localStorage.setItem(`ext_row_${index}`, JSON.stringify(data));
}

function loadRowData(index) {
    let saved = localStorage.getItem(`ext_row_${index}`);
    if (saved) {
        try {
            let data = JSON.parse(saved);
            document.getElementById(`name_${index}`).value = data.name || `Client ${index+1}`;
            document.getElementById(`dry_${index}`).value = data.dry || '';
            document.getElementById(`fresh_${index}`).value = data.fresh || '';
            document.getElementById(`cab_${index}`).value = data.cab || '';
            document.getElementById(`bo_${index}`).value = data.bo || '';
            document.getElementById(`payment_${index}`).value = data.payment || '';
            document.getElementById(`bal_${index}`).value = data.bal || '';
        } catch(e) {}
    } else {
        document.getElementById(`name_${index}`).value = `Client ${index+1}`;
        document.getElementById(`dry_${index}`).value = '';
        document.getElementById(`fresh_${index}`).value = '';
        document.getElementById(`cab_${index}`).value = '';
        document.getElementById(`bo_${index}`).value = '';
        document.getElementById(`payment_${index}`).value = '';
        document.getElementById(`bal_${index}`).value = '';
    }
    calculateRowAmount(index);
    highlightActiveRow();
    calculateGrandTotals();
}

function syncWithMainApp() {
    if (isAllOpen) return; // Do not sync/overwrite if rows are manually opened for editing

    let mDry = localStorage.getItem('order_qty_dry') || '';
    let mFresh = localStorage.getItem('order_qty_fresh') || '';
    let mCab = localStorage.getItem('order_qty_cab') || '';
    let mBo = localStorage.getItem('order_qty_bo') || '';
    let mPayment = localStorage.getItem('order_payment') || '';
    let mBal = localStorage.getItem('order_bal') || '';

    let dEl = document.getElementById(`dry_${activeRowIndex}`);
    if (dEl && document.activeElement !== dEl) {
        dEl.value = mDry;
        document.getElementById(`fresh_${activeRowIndex}`).value = mFresh;
        document.getElementById(`cab_${activeRowIndex}`).value = mCab;
        document.getElementById(`bo_${activeRowIndex}`).value = mBo;
        document.getElementById(`payment_${activeRowIndex}`).value = mPayment;
        document.getElementById(`bal_${activeRowIndex}`).value = mBal;
        
        calculateRowAmount(activeRowIndex);
        saveRow(activeRowIndex);
        calculateGrandTotals();
    }
}

function calculateGrandTotals() {
    let tAmt = 0, tDry = 0, tFresh = 0, tCab = 0, tBo = 0, tPayment = 0, tBal = 0;
    for (let i = 0; i < TOTAL_ROWS - 1; i++) {
        let getVal = (id) => {
            let el = document.getElementById(id);
            return el && el.value !== '' ? parseFloat(el.value.replace(/,/g, '')) || 0 : 0;
        };
        tDry += getVal(`dry_${i}`);
        tFresh += getVal(`fresh_${i}`);
        tCab += getVal(`cab_${i}`);
        tBo += getVal(`bo_${i}`);
        tPayment += getVal(`payment_${i}`);
        tBal += getVal(`bal_${i}`);
        tAmt += getVal(`amt_${i}`);
    }
    let tIndex = TOTAL_ROWS - 1;
    let setT = (id, val) => {
        let el = document.getElementById(`${id}_${tIndex}`);
        if (el) el.value = val !== 0 ? Math.round(val).toLocaleString() : '';
    };
    setT('dry', tDry);
    setT('fresh', tFresh);
    setT('cab', tCab);
    setT('bo', tBo);
    setT('payment', tPayment);
    setT('bal', tBal);
    setT('amt', tAmt);
}
</script>
</body>
</html>
