<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Order Sheet</title> <style> * { box-sizing: border-box; } body { margin: 0; padding: 8px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #334155; font-size: 14px; } .container { max-width: 100%; background: #ffffff; padding: 8px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1); } table { width: 100%; border-collapse: collapse; table-layout: fixed; } th, td { border: 1px solid #e2e8f0; padding: 8px 4px; text-align: center; overflow: hidden; } th { background-color: #f1f5f9; font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; } th.price-header { cursor: pointer; user-select: none; } th.price-header:active { background-color: #e2e8f0; } input { width: 100%; padding: 6px 4px; text-align: center; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background-color: #fff; transition: all 0.2s; } input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15); } input[readonly] { background-color: #f8fafc; color: #475569; font-weight: 500; border-color: #e2e8f0; } #total { color: #dc2626; font-weight: 700; background-color: #fef2f2; border-color: #fecaca; } .qty-col { width: 22%; } .price-col { width: 26%; } .label-col { width: 22%; font-weight: 600; font-size: 13px; color: #1e293b; background-color: #f8fafc; } .amt-col { width: 30%; } .auto-formula { text-align: left; font-size: 11px; font-style: italic; color: #94a3b8; background-color: #f8fafc; padding-left: 8px; } .clear-row { padding: 8px 4px; border: 1px solid #e2e8f0; text-align: center; } .clear-button { width: 100%; padding: 8px 12px; border: 1px solid #fecaca; border-radius: 6px; background-color: #fef2f2; color: #dc2626; font-size: 12px; font-weight: 700; cursor: pointer; } .clear-button:active { background-color: #fee2e2; transform: scale(0.98); } .footer-credit { text-align: center; font-style: italic; font-size: 11px; color: #94a3b8; margin-top: 8px; } </style> </head> <body> <div class="container"> <table> <tr> <th class="qty-col">QTY</th> <th class="price-col price-header" onclick="handlePriceHeaderTap()" title="Tap 5 times to unlock/lock prices"> Unit Price </th> <th class="label-col">A</th> <th class="amt-col">Amount</th> </tr> <tr> <td> <input type="number" id="qty_dry" placeholder="" oninput="saveAndCalculate()"> </td> <td> <input type="number" id="price_dry" value="45" readonly oninput="saveAndCalculate()"> </td> <td class="label-col">Dry</td> <td> <input type="text" id="amt_dry" readonly> </td> </tr> <tr> <td> <input type="number" id="qty_fresh" placeholder="" oninput="saveAndCalculate()"> </td> <td> <input type="number" id="price_fresh" value="45" readonly oninput="saveAndCalculate()"> </td> <td class="label-col">Fresh</td> <td> <input type="text" id="amt_fresh" readonly> </td> </tr> <tr> <td> <input type="number" id="qty_cab" placeholder="" oninput="saveAndCalculate()"> </td> <td> <input type="number" id="price_cab" value="40" readonly oninput="saveAndCalculate()"> </td> <td class="label-col">Cab</td> <td> <input type="text" id="amt_cab" readonly> </td> </tr> <tr> <td> <input type="number" id="qty_bo" placeholder="" oninput="saveAndCalculate()"> </td> <!-- BO 45 is now part of the price lock/unlock system --> <td> <input type="number" id="price_bo" value="45" readonly oninput="saveAndCalculate()"> </td> <td class="label-col">BO</td> <td> <input type="text" id="amt_bo" readonly> </td> </tr> <!-- Auto formula --> <tr> <td colspan="2" class="auto-formula"> Auto: (BO QTY ÷ 2) × BO Unit Price </td> <td colspan="2"></td> </tr> <!-- CLEAR QUANTITY BUTTON --> <tr> <td colspan="4" class="clear-row"> <button class="clear-button" onclick="clearQuantities()"> CLEAR QTY </button> </td> </tr> <tr> <td colspan="2"></td> <td class="label-col">Sub Total</td> <td> <input type="text" id="subtotal" readonly> </td> </tr> <tr> <td colspan="2"></td> <td class="label-col">Payment</td> <td> <input type="number" id="payment" placeholder="" oninput="saveAndCalculate()"> </td> </tr> <tr> <td colspan="2"></td> <td class="label-col">Bal</td> <td> <input type="number" id="bal" placeholder="" oninput="saveAndCalculate()"> </td> </tr> <tr> <td colspan="2"></td> <td class="label-col">Total</td> <td> <input type="text" id="total" readonly> </td> </tr> </table> <div class="footer-credit"> created by paulm </div> </div> <script> let tapCount = 0; let tapTimer = null; let isPricesUnlocked = false; const inputIds = [ 'qty_dry', 'price_dry', 'qty_fresh', 'price_fresh', 'qty_cab', 'price_cab', 'qty_bo', 'price_bo', 'payment', 'bal' ]; /* Load saved data */ window.onload = function() { inputIds.forEach(id => { let savedVal = localStorage.getItem('order_' + id); if (savedVal !== null) { document.getElementById(id).value = savedVal; } }); calculate(); }; /* Five taps unlock / lock ALL four prices */ function handlePriceHeaderTap() { tapCount++; clearTimeout(tapTimer); if (tapCount >= 5) { togglePricesLock(); tapCount = 0; } else { tapTimer = setTimeout(() => { tapCount = 0; }, 600); } } function togglePricesLock() { isPricesUnlocked = !isPricesUnlocked; let priceInputs = [ 'price_dry', 'price_fresh', 'price_cab', 'price_bo' ]; priceInputs.forEach(id => { let input = document.getElementById(id); if (isPricesUnlocked) { input.removeAttribute('readonly'); } else { input.setAttribute('readonly', 'readonly'); } }); let header = document.querySelector('.price-header'); header.style.backgroundColor = isPricesUnlocked ? '#fef08a' : '#f1f5f9'; } /* Save and calculate */ function saveAndCalculate() { inputIds.forEach(id => { let val = document.getElementById(id).value; localStorage.setItem('order_' + id, val); }); calculate(); } /* CLEAR QTY only */ function clearQuantities() { let quantityIds = [ 'qty_dry', 'qty_fresh', 'qty_cab', 'qty_bo' ]; quantityIds.forEach(id => { document.getElementById(id).value = ''; localStorage.removeItem('order_' + id); }); calculate(); } function calculate() { let getVal = (id) => parseFloat(document.getElementById(id).value) || 0; let setVal = (id, val) => document.getElementById(id).value = val ? val.toFixed(2) : ''; let amtDry = getVal('price_dry') * getVal('qty_dry'); let amtFresh = getVal('price_fresh') * getVal('qty_fresh'); let amtCab = getVal('price_cab') * getVal('qty_cab'); /* BO AUTO FORMULA */ let qtyBo = getVal('qty_bo'); let boUnitPrice = getVal('price_bo'); let amtBo = (qtyBo / 2) * boUnitPrice; setVal('amt_dry', amtDry); setVal('amt_fresh', amtFresh); setVal('amt_cab', amtCab); setVal('amt_bo', amtBo); let subTotal = amtFresh + amtDry + amtCab - amtBo; setVal('subtotal', subTotal); let payment = getVal('payment'); let bal = getVal('bal'); let total = subTotal - payment + bal; setVal('total', total); } </script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker
            .register('./sw.js')
            .then(function(registration) {
                console.log(
                    'Order Sheet offline service worker registered:',
                    registration.scope
                );
            })
            .catch(function(error) {
                console.error(
                    'Order Sheet service worker registration failed:',
                    error
                );
            });
    });
}
</script>

</body>
</html>
