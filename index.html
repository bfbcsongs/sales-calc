<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Order Sheet</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#107c41">
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 2px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f8fafc;
    color: #334155;
    font-size: 13px;
}
.app-container { max-width: 100%; display: flex; flex-direction: column; gap: 2px; }
.main-layout { display: flex; gap: 2px; align-items: stretch; max-width: 100%; }
.left-panel {
    flex: 1; min-width: 0; background: #ffffff; padding: 3px;
    border-radius: 6px; box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    border: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: space-between;
}
.right-panel {
    width: 95px; background: #ffffff; padding: 3px;
    border-radius: 6px; box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    border: 1px solid #e2e8f0; display: flex; flex-direction: column;
}
.bottom-bar { display: flex; gap: 2px; align-items: stretch; width: 100%; }
.quick-panel {
    flex: 1; min-width: 0; background: #ffffff; padding: 3px;
    border-radius: 6px; box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0;
}
.quick-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.quick-table th {
    background-color: #f1f5f9; font-size: 10px; font-weight: 700; color: #475569;
    text-transform: uppercase; border: 1px solid #e2e8f0; padding: 3px 1px; text-align: center;
}
.quick-table td { border: 1px solid #e2e8f0; padding: 3px 2px; text-align: center; }
.bottom-m-panel {
    width: 95px; background: #ffffff; padding: 3px;
    border-radius: 6px; box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center;
}
.bottom-m-btn {
    width: 100%; height: 100%; min-height: 44px; border: 1px solid #bfdbfe;
    border-radius: 4px; background-color: #dbeafe; color: #1d4ed8; font-size: 13px; font-weight: 700; cursor: pointer;
}
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td { border: 1px solid #e2e8f0; padding: 4px 1px; text-align: center; overflow: hidden; }
th { background-color: #f1f5f9; font-size: 10px; font-weight: 700; color: #475569; text-transform: uppercase; }
th.price-header { cursor: pointer; user-select: none; }
input {
    width: 100%; padding: 3px 1px; text-align: center;
    border: 1px solid #cbd5e1; border-radius: 3px; font-size: 12px; background-color: #fff;
}
input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15); }
input[readonly] { background-color: #f8fafc; color: #475569; font-weight: 500; border-color: #e2e8f0; }
#total { color: #dc2626; font-weight: 700; background-color: #fef2f2; border-color: #fecaca; }
.qty-col { width: 28%; }
.price-col { width: 20%; }
.label-col { width: 18%; font-weight: 600; font-size: 11px; color: #1e293b; background-color: #f8fafc; }
.amt-col { width: 34%; }
.utility-row { background-color: #f8fafc; }
.auto-formula { text-align: left; font-size: 8px; font-style: italic; color: #94a3b8; padding-left: 2px; }
.clear-button {
    width: 100%; padding: 3px 4px; border: 1px solid #fecaca; border-radius: 3px;
    background-color: #fef2f2; color: #dc2626; font-size: 10px; font-weight: 700; cursor: pointer;
}
.mem-btn {
    width: 100%; padding: 3px 1px; border: 1px solid #cbd5e1; border-radius: 3px;
    background-color: #e2e8f0; color: #1e293b; font-size: 10px; font-weight: 700; cursor: pointer;
}
.mem-btn.m-plus { background-color: #dbeafe; border-color: #bfdbfe; color: #1d4ed8; }
.mem-btn.mc { background-color: #fee2e2; border-color: #fecaca; color: #dc2626; }
.history-header {
    font-size: 9px; font-weight: 700; text-transform: uppercase; color: #475569;
    padding: 4px 2px; background-color: #f1f5f9; border: 1px solid #e2e8f0; text-align: center;
    border-top-left-radius: 5px; border-top-right-radius: 5px;
}
.history-list {
    list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto;
    border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; background: #fff;
}
.history-item { font-size: 11px; padding: 2px 3px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; color: #1d4ed8; font-weight: 600; }
.history-input { width: 100%; border: 1px solid transparent; background: transparent; color: #1d4ed8; font-weight: 600; font-size: 11px; text-align: center; padding: 1px; }
.history-footer { border: 1px solid #bfdbfe; background-color: #eff6ff; padding: 4px; border-bottom-left-radius: 5px; border-bottom-right-radius: 5px; text-align: center; }
.history-footer input { background: transparent; border: none; color: #1d4ed8; font-weight: 700; font-size: 10px; padding: 0; }
.footer-credit { text-align: center; font-style: italic; font-size: 9px; color: #94a3b8; margin-top: 2px; }
</style>
</head>
<body>

<div class="app-container">
<div class="main-layout">
<div class="left-panel">
<div>
<table>
<tr>
    <th class="qty-col">QTY</th>
    <th class="price-col price-header" onclick="handlePriceHeaderTap()" title="Tap 5 times">Unit Price</th>
    <th class="label-col">A</th>
    <th class="amt-col">Amount</th>
</tr>
<tr>
    <td><input type="number" id="qty_dry" oninput="syncAndCalculate('qty_dry')"></td>
    <td><input type="number" id="price_dry" value="45" readonly oninput="saveAndCalculate()"></td>
    <td class="label-col">Dry</td>
    <td><input type="text" id="amt_dry" readonly></td>
</tr>
<tr>
    <td><input type="number" id="qty_fresh" oninput="syncAndCalculate('qty_fresh')"></td>
    <td><input type="number" id="price_fresh" value="45" readonly oninput="saveAndCalculate()"></td>
    <td class="label-col">Fresh</td>
    <td><input type="text" id="amt_fresh" readonly></td>
</tr>
<tr>
    <td><input type="number" id="qty_cab" oninput="syncAndCalculate('qty_cab')"></td>
    <td><input type="number" id="price_cab" value="40" readonly oninput="saveAndCalculate()"></td>
    <td class="label-col">Cab</td>
    <td><input type="text" id="amt_cab" readonly></td>
</tr>
<tr>
    <td><input type="number" id="qty_bo" oninput="syncAndCalculate('qty_bo')"></td>
    <td><input type="number" id="price_bo" value="45" readonly oninput="saveAndCalculate()"></td>
    <td class="label-col">BO</td>
    <td><input type="text" id="amt_bo" readonly></td>
</tr>
<tr class="utility-row">
    <td colspan="2" class="auto-formula">Auto: (BO ÷ 2) × Price</td>
    <td colspan="2"><button class="clear-button" onclick="clearQuantities()">CLEAR QTY</button></td>
</tr>
<tr>
    <td><button class="mem-btn m-plus" onclick="memoryAdd()">M+</button></td>
    <td colspan="2" class="label-col">Sub Total</td>
    <td><input type="text" id="subtotal" readonly></td>
</tr>
<tr>
    <td><button class="mem-btn mc" onclick="memoryClear()">MC</button></td>
    <td colspan="2" class="label-col">Payment</td>
    <td><input type="number" id="payment" oninput="saveAndCalculate()"></td>
</tr>
<tr>
    <td><button class="mem-btn" onclick="memoryRecall()">MR</button></td>
    <td colspan="2" class="label-col">Bal</td>
    <td><input type="number" id="bal" oninput="saveAndCalculate()"></td>
</tr>
<tr>
    <td><input type="text" id="m_display" readonly style="font-size:10px; font-weight:bold; color:#1d4ed8; background:#eff6ff;"></td>
    <td colspan="2" class="label-col">Total</td>
    <td><input type="text" id="total" readonly></td>
</tr>
</table>
</div>
<div class="footer-credit">created by paulm</div>
</div>

<div class="right-panel">
    <div class="history-header">M+ History</div>
    <ul id="history-list" class="history-list">
        <li style="text-align:center; color:#94a3b8; font-size:10px; padding:20px 4px;">No entries</li>
    </ul>
    <div class="history-footer">
        <input type="text" id="history_total" readonly placeholder="0">
    </div>
</div>
</div>

<div class="bottom-bar">
    <div class="quick-panel">
        <table class="quick-table">
            <tr><th>Dry</th><th>Fresh</th><th>Cab</th><th>Bo</th></tr>
            <tr>
                <td><input type="number" id="quick_qty_dry" oninput="syncAndCalculate('quick_qty_dry')"></td>
                <td><input type="number" id="quick_qty_fresh" oninput="syncAndCalculate('quick_qty_fresh')"></td>
                <td><input type="number" id="quick_qty_cab" oninput="syncAndCalculate('quick_qty_cab')"></td>
                <td><input type="number" id="quick_qty_bo" oninput="syncAndCalculate('quick_qty_bo')"></td>
            </tr>
        </table>
    </div>
    <div class="bottom-m-panel">
        <button class="bottom-m-btn" onclick="memoryAdd()">M+</button>
    </div>
</div>

<!-- Extension Table Frame sa Ibaba -->
<iframe src="extension.html" style="width:100%; height:500px; border:none; border-radius:6px; margin-top:4px; background:transparent;" id="extFrame"></iframe>

</div>

<script>
let tapCount = 0; let tapTimer = null; let isPricesUnlocked = false;
const inputIds = ['qty_dry', 'price_dry', 'qty_fresh', 'price_fresh', 'qty_cab', 'price_cab', 'qty_bo', 'price_bo', 'payment', 'bal'];

window.onload = function() {
    inputIds.forEach(id => {
        let savedVal = localStorage.getItem('order_' + id);
        if (savedVal !== null) {
            let el = document.getElementById(id);
            if(el) el.value = savedVal;
            if (id.startsWith('qty_')) {
                let quickEl = document.getElementById('quick_' + id);
                if (quickEl) quickEl.value = savedVal;
            }
        }
    });
    let savedHistory = localStorage.getItem('order_history');
    if (savedHistory !== null) {
        try { memoryHistory = JSON.parse(savedHistory); } catch(e) { memoryHistory = []; }
    }
    recalculateMemoryFromHistory();
    calculate();
};

let memoryValue = 0; let memoryHistory = [];

function memoryAdd() {
    let totalFieldVal = document.getElementById('total').value.replace(/,/g, '');
    let currentTotal = parseFloat(totalFieldVal) || 0;
    if (currentTotal === 0) return;
    memoryHistory.push({ amount: currentTotal });
    saveAndRefreshHistory();
}

function updateHistoryItem(index, valueStr) {
    let cleanVal = parseFloat(valueStr.replace(/,/g, '')) || 0;
    memoryHistory[index].amount = cleanVal;
    saveAndRefreshHistory();
}

function saveAndRefreshHistory() {
    memoryValue = 0;
    memoryHistory.forEach(item => { memoryValue += item.amount; });
    localStorage.setItem('order_memory', memoryValue);
    localStorage.setItem('order_history', JSON.stringify(memoryHistory));
    updateMemoryDisplay();
    updateHistoryDisplay();
}

function recalculateMemoryFromHistory() {
    memoryValue = 0;
    memoryHistory.forEach(item => { memoryValue += item.amount; });
    updateMemoryDisplay();
    updateHistoryDisplay();
}

function memoryClear() {
    memoryValue = 0; memoryHistory = [];
    localStorage.removeItem('order_memory'); localStorage.removeItem('order_history');
    updateMemoryDisplay(); updateHistoryDisplay();
}

function memoryRecall() {
    document.getElementById('bal').value = memoryValue !== 0 ? memoryValue : '';
    saveAndCalculate();
}

function updateMemoryDisplay() {
    let mDisplay = document.getElementById('m_display');
    if (mDisplay) { mDisplay.value = memoryValue !== 0 ? Math.round(memoryValue).toLocaleString() : ''; }
}

function updateHistoryDisplay() {
    let listEl = document.getElementById('history-list');
    let totalEl = document.getElementById('history_total');
    if (!listEl) return;
    if (memoryHistory.length === 0) {
        listEl.innerHTML = '<li style="text-align:center; color:#94a3b8; font-size:10px; padding:20px 4px;">No entries</li>';
        if (totalEl) totalEl.value = '';
        return;
    }
    let html = '';
    memoryHistory.forEach((item, index) => {
        html += `<li class="history-item"><input type="text" class="history-input" value="+${Math.round(item.amount).toLocaleString()}" onchange="updateHistoryItem(${index}, this.value)"></li>`;
    });
    listEl.innerHTML = html;
    if (totalEl) { totalEl.value = Math.round(memoryValue).toLocaleString(); }
}

function handlePriceHeaderTap() {
    tapCount++;
    clearTimeout(tapTimer);
    if (tapCount >= 5) {
        togglePricesLock();
        tapCount = 0;
    } else {
        tapTimer = setTimeout(() => { tapCount = 0; }, 600);
    }
}

function togglePricesLock() {
    isPricesUnlocked = !isPricesUnlocked;
    ['price_dry', 'price_fresh', 'price_cab', 'price_bo'].forEach(id => {
        let input = document.getElementById(id);
        if (input) {
            if (isPricesUnlocked) input.removeAttribute('readonly');
            else input.setAttribute('readonly', 'readonly');
        }
    });
    let header = document.querySelector('.price-header');
    if (header) header.style.backgroundColor = isPricesUnlocked ? '#fef08a' : '#f1f5f9';
}

function syncAndCalculate(sourceId) {
    let el = document.getElementById(sourceId);
    if (!el) return;
    let val = el.value;
    if (sourceId.startsWith('quick_')) {
        let targetId = sourceId.replace('quick_', '');
        let targetEl = document.getElementById(targetId);
        if (targetEl) targetEl.value = val;
    } else {
        let quickEl = document.getElementById('quick_' + sourceId);
        if (quickEl) quickEl.value = val;
    }
    saveAndCalculate();
}

function saveAndCalculate() {
    inputIds.forEach(id => {
        let el = document.getElementById(id);
        if (el) localStorage.setItem('order_' + id, el.value);
    });
    calculate();
}

function clearQuantities() {
    ['qty_dry', 'qty_fresh', 'qty_cab', 'qty_bo', 'payment', 'bal'].forEach(id => {
        let el = document.getElementById(id);
        if (el) el.value = '';
        let quickEl = document.getElementById('quick_' + id);
        if (quickEl) quickEl.value = '';
        localStorage.removeItem('order_' + id);
    });
    calculate();
}

function calculate() {
    let getVal = (id) => {
        let el = document.getElementById(id);
        return el && el.value !== '' ? parseFloat(el.value) || 0 : 0;
    };
    let setVal = (id, val) => {
        let el = document.getElementById(id);
        if (el) el.value = (val && val !== 0) ? Math.round(val).toLocaleString() : '';
    };

    let amtDry = getVal('price_dry') * getVal('qty_dry');
    let amtFresh = getVal('price_fresh') * getVal('qty_fresh');
    let amtCab = getVal('price_cab') * getVal('qty_cab');
    let qtyBo = getVal('qty_bo');
    let boUnitPrice = getVal('price_bo');
    let amtBo = (qtyBo / 2) * boUnitPrice;

    setVal('amt_dry', amtDry);
    setVal('amt_fresh', amtFresh);
    setVal('amt_cab', amtCab);
    setVal('amt_bo', amtBo);

    let subTotal = amtFresh + amtDry + amtCab - amtBo;
    setVal('subtotal', subTotal);

    let payment = getVal('payment');
    let bal = getVal('bal');
    let total = subTotal - payment + bal;
    setVal('total', total);
}
</script>

</body>
</html>
