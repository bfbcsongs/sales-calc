<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Order Sheet</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#107c41">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sales Calc">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f8fafc;
    color: #334155;
    font-size: 14px;
}

.container {
    max-width: 100%;
    background: #ffffff;
    padding: 8px;
    border-radius: 12px;
    box-shadow:
        0 4px 6px -1px rgba(0, 0, 0, 0.1),
        0 2px 4px -2px rgba(0, 0, 0, 0.1);
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th,
td {
    border: 1px solid #e2e8f0;
    padding: 8px 4px;
    text-align: center;
    overflow: hidden;
}

th {
    background-color: #f1f5f9;
    font-size: 11px;
    font-weight: 700;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

th.price-header {
    cursor: pointer;
    user-select: none;
}

th.price-header:active {
    background-color: #e2e8f0;
}

input {
    width: 100%;
    padding: 6px 4px;
    text-align: center;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
    background-color: #fff;
    transition: all 0.2s;
}

input:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
}

input[readonly] {
    background-color: #f8fafc;
    color: #475569;
    font-weight: 500;
    border-color: #e2e8f0;
}

#total {
    color: #dc2626;
    font-weight: 700;
    background-color: #fef2f2;
    border-color: #fecaca;
}

.qty-col {
    width: 22%;
}

.price-col {
    width: 26%;
}

.label-col {
    width: 22%;
    font-weight: 600;
    font-size: 13px;
    color: #1e293b;
    background-color: #f8fafc;
}

.amt-col {
    width: 30%;
}

.auto-formula {
    text-align: left;
    font-size: 11px;
    font-style: italic;
    color: #94a3b8;
    background-color: #f8fafc;
    padding-left: 8px;
}

.clear-row {
    padding: 8px 4px;
    border: 1px solid #e2e8f0;
    text-align: center;
}

.clear-button {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #fecaca;
    border-radius: 6px;
    background-color: #fef2f2;
    color: #dc2626;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.clear-button:active {
    background-color: #fee2e2;
    transform: scale(0.98);
}

.mem-btn {
    width: 100%;
    padding: 6px 2px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    background-color: #e2e8f0;
    color: #1e293b;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}

.mem-btn:active {
    background-color: #cbd5e1;
    transform: scale(0.98);
}

.mem-btn.m-plus {
    background-color: #dbeafe;
    border-color: #bfdbfe;
    color: #1d4ed8;
}

.mem-btn.mc {
    background-color: #fee2e2;
    border-color: #fecaca;
    color: #dc2626;
}

.history-container {
    margin-top: 12px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #f8fafc;
    padding: 8px;
    max-height: 180px;
    overflow-y: auto;
}

.history-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: #475569;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.history-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.history-item {
    font-size: 12px;
    padding: 6px 8px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.history-item span.amount {
    font-weight: 700;
    color: #1d4ed8;
}

.footer-credit {
    text-align: center;
    font-style: italic;
    font-size: 11px;
    color: #94a3b8;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="container">

<table>

<tr>
    <th class="qty-col">QTY</th>
    <th
        class="price-col price-header"
        onclick="handlePriceHeaderTap()"
        title="Tap 5 times to unlock/lock prices"
    >
        Unit Price
    </th>
    <th class="label-col">A</th>
    <th class="amt-col">Amount</th>
</tr>

<tr>
    <td>
        <input
            type="number"
            id="qty_dry"
            placeholder=""
            oninput="saveAndCalculate()"
        >
    </td>
    <td>
        <input
            type="number"
            id="price_dry"
            value="45"
            readonly
            oninput="saveAndCalculate()"
        >
    </td>
    <td class="label-col">Dry</td>
    <td>
        <input type="text" id="amt_dry" readonly>
    </td>
</tr>

<tr>
    <td>
        <input
            type="number"
            id="qty_fresh"
            placeholder=""
            oninput="saveAndCalculate()"
        >
    </td>
    <td>
        <input
            type="number"
            id="price_fresh"
            value="45"
            readonly
            oninput="saveAndCalculate()"
        >
    </td>
    <td class="label-col">Fresh</td>
    <td>
        <input type="text" id="amt_fresh" readonly>
    </td>
</tr>

<tr>
    <td>
        <input
            type="number"
            id="qty_cab"
            placeholder=""
            oninput="saveAndCalculate()"
        >
    </td>
    <td>
        <input
            type="number"
            id="price_cab"
            value="40"
            readonly
            oninput="saveAndCalculate()"
        >
    </td>
    <td class="label-col">Cab</td>
    <td>
        <input type="text" id="amt_cab" readonly>
    </td>
</tr>

<tr>
    <td>
        <input
            type="number"
            id="qty_bo"
            placeholder=""
            oninput="saveAndCalculate()"
        >
    </td>
    <td>
        <input
            type="number"
            id="price_bo"
            value="45"
            readonly
            oninput="saveAndCalculate()"
        >
    </td>
    <td class="label-col">BO</td>
    <td>
        <input type="text" id="amt_bo" readonly>
    </td>
</tr>

<tr>
    <td colspan="2" class="auto-formula">
        Auto: (BO QTY ÷ 2) × BO Unit Price
    </td>
    <td colspan="2"></td>
</tr>

<tr>
    <td colspan="4" class="clear-row">
        <button
            class="clear-button"
            onclick="clearQuantities()"
        >
            CLEAR QTY
        </button>
    </td>
</tr>

<!-- Row 1: Sub Total -->
<tr>
    <td colspan="2">
        <button class="mem-btn m-plus" onclick="memoryAdd()" title="Add Total to M+">M+</button>
    </td>
    <td class="label-col">Sub Total</td>
    <td>
        <input
            type="text"
            id="subtotal"
            readonly
        >
    </td>
</tr>

<!-- Row 2: Payment -->
<tr>
    <td colspan="2">
        <button class="mem-btn mc" onclick="memoryClear()" title="Clear Memory">MC</button>
    </td>
    <td class="label-col">Payment</td>
    <td>
        <input
            type="number"
            id="payment"
            placeholder=""
            oninput="saveAndCalculate()"
        >
    </td>
</tr>

<!-- Row 3: Bal -->
<tr>
    <td colspan="2">
        <button class="mem-btn" onclick="memoryRecall()" title="Recall M+ to Balance">MR</button>
    </td>
    <td class="label-col">Bal</td>
    <td>
        <input
            type="number"
            id="bal"
            placeholder=""
            oninput="saveAndCalculate()"
        >
    </td>
</tr>

<!-- Row 4: Total & Pure M+ Value Full-Width Display Beside Total -->
<tr>
    <td colspan="2">
        <input type="text" id="m_display" value="" readonly style="font-size:13px; font-weight:bold; color:#1d4ed8; background:#eff6ff;">
    </td>
    <td class="label-col">Total</td>
    <td>
        <input
            type="text"
            id="total"
            readonly
        >
    </td>
</tr>

</table>

<!-- M+ History Log Section -->
<div class="history-container">
    <div class="history-title">
        <span>M+ Review List</span>
        <span id="history-count" style="font-weight:normal; color:#94a3b8;">0 items</span>
    </div>
    <ul id="history-list" class="history-list">
        <li style="text-align:center; color:#94a3b8; font-size:11px; padding:6px;">No M+ entries yet</li>
    </ul>
</div>

<div class="footer-credit">
    created by paulm
</div>

</div>

<script>

let tapCount = 0;
let tapTimer = null;
let isPricesUnlocked = false;

const inputIds = [
    'qty_dry',
    'price_dry',
    'qty_fresh',
    'price_fresh',
    'qty_cab',
    'price_cab',
    'qty_bo',
    'price_bo',
    'payment',
    'bal'
];

/* Load saved data */
window.onload = function() {
    inputIds.forEach(id => {
        let savedVal = localStorage.getItem('order_' + id);
        if (savedVal !== null) {
            document.getElementById(id).value = savedVal;
        }
    });

    let savedMemory = localStorage.getItem('order_memory');
    if (savedMemory !== null) {
        memoryValue = parseFloat(savedMemory) || 0;
        updateMemoryDisplay();
    }

    let savedHistory = localStorage.getItem('order_history');
    if (savedHistory !== null) {
        try {
            memoryHistory = JSON.parse(savedHistory);
        } catch(e) {
            memoryHistory = [];
        }
    }

    updateHistoryDisplay();
    calculate();
};

let memoryValue = 0;
let memoryHistory = [];

function memoryAdd() {
    let currentTotal = parseFloat(document.getElementById('total').value) || 0;
    if (currentTotal === 0) return; // Don't add zero totals

    memoryValue += currentTotal;
    
    // Create history item record with timestamp
    let now = new Date();
    let timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    
    memoryHistory.unshift({
        time: timeStr,
        amount: currentTotal
    });

    localStorage.setItem('order_memory', memoryValue);
    localStorage.setItem('order_history', JSON.stringify(memoryHistory));
    
    updateMemoryDisplay();
    updateHistoryDisplay();
}

function memoryClear() {
    memoryValue = 0;
    memoryHistory = [];
    localStorage.removeItem('order_memory');
    localStorage.removeItem('order_history');
    updateMemoryDisplay();
    updateHistoryDisplay();
}

function memoryRecall() {
    document.getElementById('bal').value = memoryValue !== 0 ? memoryValue : '';
    saveAndCalculate();
}

function updateMemoryDisplay() {
    let mDisplay = document.getElementById('m_display');
    if (mDisplay) {
        mDisplay.value = memoryValue !== 0 ? memoryValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '';
    }
}

function updateHistoryDisplay() {
    let listEl = document.getElementById('history-list');
    let countEl = document.getElementById('history-count');
    
    if (!listEl) return;

    countEl.textContent = memoryHistory.length + (memoryHistory.length === 1 ? ' item' : ' items');

    if (memoryHistory.length === 0) {
        listEl.innerHTML = '<li style="text-align:center; color:#94a3b8; font-size:11px; padding:6px;">No M+ entries yet</li>';
        return;
    }

    let html = '';
    memoryHistory.forEach((item, index) => {
        let formattedAmt = item.amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        html += `<li class="history-item">
            <span style="color:#64748b;">#${memoryHistory.length - index} (${item.time})</span>
            <span class="amount">+${formattedAmt}</span>
        </li>`;
    });
    listEl.innerHTML = html;
}


/* Five taps unlock / lock ALL four prices */
function handlePriceHeaderTap() {
    tapCount++;
    clearTimeout(tapTimer);
    if (tapCount >= 5) {
        togglePricesLock();
        tapCount = 0;
    } else {
        tapTimer = setTimeout(() => {
            tapCount = 0;
        }, 600);
    }
}


function togglePricesLock() {
    isPricesUnlocked = !isPricesUnlocked;
    let priceInputs = [
        'price_dry',
        'price_fresh',
        'price_cab',
        'price_bo'
    ];

    priceInputs.forEach(id => {
        let input = document.getElementById(id);
        if (isPricesUnlocked) {
            input.removeAttribute('readonly');
        } else {
            input.setAttribute('readonly', 'readonly');
        }
    });

    let header = document.querySelector('.price-header');
    header.style.backgroundColor = isPricesUnlocked ? '#fef08a' : '#f1f5f9';
}


/* Save and calculate */
function saveAndCalculate() {
    inputIds.forEach(id => {
        let val = document.getElementById(id).value;
        localStorage.setItem('order_' + id, val);
    });
    calculate();
}


/* CLEAR QTY, Payment, at Bal */
function clearQuantities() {
    let fieldsToClear = [
        'qty_dry',
        'qty_fresh',
        'qty_cab',
        'qty_bo',
        'payment',
        'bal'
    ];

    fieldsToClear.forEach(id => {
        let el = document.getElementById(id);
        if (el) { el.value = ''; }
        localStorage.removeItem('order_' + id);
    });

    calculate();
}


function calculate() {
    let getVal = (id) => {
        let el = document.getElementById(id);
        return el && el.value !== '' ? parseFloat(el.value) || 0 : 0;
    };

    let setVal = (id, val) => {
        let el = document.getElementById(id);
        if (el) {
            el.value = (val && val !== 0) ? val.toFixed(2) : '';
        }
    };

    let amtDry = getVal('price_dry') * getVal('qty_dry');
    let amtFresh = getVal('price_fresh') * getVal('qty_fresh');
    let amtCab = getVal('price_cab') * getVal('qty_cab');

    /* BO AUTO FORMULA */
    let qtyBo = getVal('qty_bo');
    let boUnitPrice = getVal('price_bo');
    let amtBo = (qtyBo / 2) * boUnitPrice;

    setVal('amt_dry', amtDry);
    setVal('amt_fresh', amtFresh);
    setVal('amt_cab', amtCab);
    setVal('amt_bo', amtBo);

    let subTotal = amtFresh + amtDry + amtCab - amtBo;
    setVal('subtotal', subTotal);

    let payment = getVal('payment');
    let bal = getVal('bal');
    let total = subTotal - payment + bal;
    setVal('total', total);
}

let deferredPrompt;
let installButton;

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    
    if (!installButton) {
        installButton = document.createElement('button');
        installButton.textContent = 'Install App';
        installButton.style.cssText = 'padding: 10px 20px; background-color: #107c41; color: white; border: none; border-radius: 6px; cursor: pointer; margin: 10px; width: 100%; font-weight: 700;';
        document.querySelector('.container').insertBefore(installButton, document.querySelector('table'));
        
        installButton.addEventListener('click', async () => {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response: ${outcome}`);
            deferredPrompt = null;
            installButton.style.display = 'none';
        });
    }
});

window.addEventListener('appinstalled', () => {
    console.log('App installed successfully');
    if (installButton) installButton.style.display = 'none';
    deferredPrompt = null;
});

/* Register offline Service Worker */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
            console.log('ServiceWorker registration failed: ', err);
        });
    });
}

</script>

</body>
</html>
