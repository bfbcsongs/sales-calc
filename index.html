<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 2px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: transparent;
    font-size: 12px;
}

.ext-container {
    background: #ffffff;
    padding: 3px;
    border-radius: 6px;
    box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    border: 1px solid #e2e8f0;
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th, td {
    border: 1px solid #e2e8f0;
    padding: 3px 1px;
    text-align: center;
    overflow: hidden;
    height: 26px;
}

th {
    background-color: #f1f5f9;
    font-size: 9px;
    font-weight: 700;
    color: #475569;
    text-transform: uppercase;
}

th.key-header {
    cursor: pointer;
    user-select: none;
    font-size: 12px;
}

/* Column Width Specifications */
.col-name { width: 20%; }
.col-num  { width: 10%; }
.col-amt  { width: 20%; }

input {
    width: 100%;
    height: 100%;
    padding: 1px;
    text-align: center;
    border: 1px solid transparent;
    border-radius: 2px;
    font-size: 11px;
    background-color: transparent;
}

input:focus {
    outline: none;
    border-color: #3b82f6;
    background-color: #fff;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
}

input[readonly] {
    background-color: transparent;
    color: #334155;
}

/* Active Row Highlighting */
tr.active-row td {
    background-color: #eff6ff !important;
    border-color: #bfdbfe;
}

tr.active-row input {
    color: #1d4ed8;
    font-weight: 600;
}

/* Total Row Styling */
tr.total-row td {
    background-color: #fef2f2 !important;
    font-weight: 700;
    color: #dc2626;
}
tr.total-row input {
    color: #dc2626;
    font-weight: 700;
}
</style>
</head>
<body>

<div class="ext-container">
    <table id="extTable">
        <!-- Generated dynamically via JS -->
    </table>
</div>

<script>
let keyTapCount = 0;
let keyTapTimer = null;
let isNameUnlocked = false;
let activeRowIndex = 0; 

const TOTAL_ROWS = 17; // 16 data rows + 1 Total row

window.onload = function() {
    buildTable();
    loadRowData(activeRowIndex);
    
    // Periodic sync check with main app localstorage
    setInterval(syncWithMainApp, 500);
};

function buildTable() {
    let table = document.getElementById('extTable');
    let html = `<tr>
        <th class="col-name key-header" onclick="handleKeyTap()" title="Tap 3 times to unlock/lock name column">🔑</th>
        <th class="col-num">Dry</th>
        <th class="col-num">Fresh</th>
        <th class="col-num">Cab</th>
        <th class="col-num">BO</th>
        <th class="col-num">Payment</th>
        <th class="col-num">Bal</th>
        <th class="col-amt">Amount</th>
    </tr>`;

    for (let i = 0; i < TOTAL_ROWS; i++) {
        let isTotalRow = (i === TOTAL_ROWS - 1);
        
        if (isTotalRow) {
            html += `<tr id="row_${i}" class="total-row">
                <td><input type="text" id="name_${i}" value="TOTAL" readonly></td>
                <td><input type="text" id="dry_${i}" readonly></td>
                <td><input type="text" id="fresh_${i}" readonly></td>
                <td><input type="text" id="cab_${i}" readonly></td>
                <td><input type="text" id="bo_${i}" readonly></td>
                <td><input type="text" id="payment_${i}" readonly></td>
                <td><input type="text" id="bal_${i}" readonly></td>
                <td><input type="text" id="amt_${i}" readonly style="font-weight:700; color:#dc2626;"></td>
            </tr>`;
        } else {
            html += `<tr id="row_${i}" onclick="selectRow(${i})">
                <td><input type="text" id="name_${i}" value="Client ${i+1}" readonly oninput="saveRow(${i})"></td>
                <td><input type="number" id="dry_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="fresh_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="cab_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="bo_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="payment_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="number" id="bal_${i}" readonly oninput="onFieldInput(${i})"></td>
                <td><input type="text" id="amt_${i}" readonly style="font-weight:700; color:#dc2626;"></td>
            </tr>`;
        }
    }
    table.innerHTML = html;
}

function handleKeyTap() {
    keyTapCount++;
    clearTimeout(keyTapTimer);
    if (keyTapCount >= 3) {
        toggleNameLock();
        keyTapCount = 0;
    } else {
        keyTapTimer = setTimeout(() => { keyTapCount = 0; }, 600);
    }
}

function toggleNameLock() {
    isNameUnlocked = !isNameUnlocked;
    for (let i = 0; i < TOTAL_ROWS - 1; i++) {
        let input = document.getElementById(`name_${i}`);
        if (input) {
            if (isNameUnlocked) input.removeAttribute('readonly');
            else input.setAttribute('readonly', 'readonly');
        }
    }
    let header = document.querySelector('.key-header');
    if (header) header.style.backgroundColor = isNameUnlocked ? '#fef08a' : '#f1f5f9';
}

function selectRow(index) {
    if (index === TOTAL_ROWS - 1) return;
    if (activeRowIndex === index) return;
    
    saveRow(activeRowIndex);
    activeRowIndex = index;
    highlightActiveRow();
    loadRowData(activeRowIndex);
}

function highlightActiveRow() {
    for (let i = 0; i < TOTAL_ROWS; i++) {
        let tr = document.getElementById(`row_${i}`);
        if (tr && i !== TOTAL_ROWS - 1) {
            if (i === activeRowIndex) tr.classList.add('active-row');
            else tr.classList.remove('active-row');
        }
    }
}

function onFieldInput(index) {
    calculateRowAmount(index);
    saveRow(index);
    calculateGrandTotals();
}

function calculateRowAmount(index) {
    let getVal = (id) => {
        let el = document.getElementById(id);
        return el && el.value !== '' ? parseFloat(el.value) || 0 : 0;
    };
    
    let dry = getVal(`dry_${index}`);
    let fresh = getVal(`fresh_${index}`);
    let cab = getVal(`cab_${index}`);
    let bo = getVal(`bo_${index}`);
    
    let amt = (dry * 45) + (fresh * 45) + (cab * 40) - ((bo / 2) * 45);
    
    let amtEl = document.getElementById(`amt_${index}`);
    if (amtEl) {
        amtEl.value = amt !== 0 ? Math.round(amt).toLocaleString() : '';
    }
}

function saveRow(index) {
    let data = {
        name: document.getElementById(`name_${index}`).value,
        dry: document.getElementById(`dry_${index}`).value,
        fresh: document.getElementById(`fresh_${index}`).value,
        cab: document.getElementById(`cab_${index}`).value,
        bo: document.getElementById(`bo_${index}`).value,
        payment: document.getElementById(`payment_${index}`).value,
        bal: document.getElementById(`bal_${index}`).value
    };
    localStorage.setItem(`ext_row_${index}`, JSON.stringify(data));
}

function loadRowData(index) {
    let saved = localStorage.getItem(`ext_row_${index}`);
    if (saved) {
        try {
            let data = JSON.parse(saved);
            document.getElementById(`name_${index}`).value = data.name || `Client ${index+1}`;
            document.getElementById(`dry_${index}`).value = data.dry || '';
            document.getElementById(`fresh_${index}`).value = data.fresh || '';
            document.getElementById(`cab_${index}`).value = data.cab || '';
            document.getElementById(`bo_${index}`).value = data.bo || '';
            document.getElementById(`payment_${index}`).value = data.payment || '';
            document.getElementById(`bal_${index}`).value = data.bal || '';
        } catch(e) {}
    }
    calculateRowAmount(index);
    highlightActiveRow();
    calculateGrandTotals();
}

function syncWithMainApp() {
    let mainQtyDry = localStorage.getItem('order_qty_dry') || '';
    let mainQtyFresh = localStorage.getItem('order_qty_fresh') || '';
    let mainQtyCab = localStorage.getItem('order_qty_cab') || '';
    let mainQtyBo = localStorage.getItem('order_qty_bo') || '';
    let mainTotal = localStorage.getItem('order_total') || '';
    let mainBal = localStorage.getItem('order_bal') || '';

    let activeDry = document.getElementById(`dry_${activeRowIndex}`);
    if (activeDry && activeDry !== document.activeElement) {
        activeDry.value = mainQtyDry;
        document.getElementById(`fresh_${activeRowIndex}`).value = mainQtyFresh;
        document.getElementById(`cab_${activeRowIndex}`).value = mainQtyCab;
        document.getElementById(`bo_${activeRowIndex}`).value = mainQtyBo;
        document.getElementById(`payment_${activeRowIndex}`).value = mainTotal;
        document.getElementById(`bal_${activeRowIndex}`).value = mainBal;
        
        calculateRowAmount(activeRowIndex);
        saveRow(activeRowIndex);
        calculateGrandTotals();
    }
}

function calculateGrandTotals() {
    let totalAmt = 0;
    let totalDry = 0;
    let totalFresh = 0;
    let totalCab = 0;
    let totalBo = 0;
    let totalPayment = 0;
    let totalBal = 0;

    for (let i = 0; i < TOTAL_ROWS - 1; i++) {
        let getVal = (id) => {
            let el = document.getElementById(id);
            return el && el.value !== '' ? parseFloat(el.value.replace(/,/g, '')) || 0 : 0;
        };
        
        totalDry += getVal(`dry_${i}`);
        totalFresh += getVal(`fresh_${i}`);
        totalCab += getVal(`cab_${i}`);
        totalBo += getVal(`bo_${i}`);
        totalPayment += getVal(`payment_${i}`);
        totalBal += getVal(`bal_${i}`);
        totalAmt += getVal(`amt_${i}`);
    }

    let tIndex = TOTAL_ROWS - 1;
    let setT = (id, val) => {
        let el = document.getElementById(`${id}_${tIndex}`);
        if (el) el.value = val !== 0 ? Math.round(val).toLocaleString() : '';
    };

    setT('dry', totalDry);
    setT('fresh', totalFresh);
    setT('cab', totalCab);
    setT('bo', totalBo);
    setT('payment', totalPayment);
    setT('bal', totalBal);
    setT('amt', totalAmt);
}
</script>
<iframe src="extension.html" style="width:100%; height:450px; border:none; border-radius:6px; margin-top:4px; background:transparent;" id="extFrame"></iframe>
</body>
</html>
