<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: transparent;
}
.bottom-bar {
    display: flex;
    gap: 2px;
    align-items: stretch;
    width: 100%;
}
.quick-panel {
    flex: 1;
    min-width: 0;
    background: #ffffff;
    padding: 3px;
    border-radius: 6px;
    box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    border: 1px solid #e2e8f0;
}
.quick-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}
.quick-table th {
    background-color: #f1f5f9;
    font-size: 10px;
    font-weight: 700;
    color: #475569;
    text-transform: uppercase;
    border: 1px solid #e2e8f0;
    padding: 3px 1px;
    text-align: center;
}
.quick-table td {
    border: 1px solid #e2e8f0;
    padding: 3px 2px;
    text-align: center;
}
input {
    width: 100%;
    padding: 3px 1px;
    text-align: center;
    border: 1px solid #cbd5e1;
    border-radius: 3px;
    font-size: 12px;
    background-color: #fff;
}
input:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
}
.bottom-m-panel {
    width: 95px;
    background: #ffffff;
    padding: 3px;
    border-radius: 6px;
    box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
    border: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
}
.bottom-m-btn {
    width: 100%;
    height: 100%;
    min-height: 44px;
    border: 1px solid #bfdbfe;
    border-radius: 4px;
    background-color: #dbeafe;
    color: #1d4ed8;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="bottom-bar">
    <div class="quick-panel">
        <table class="quick-table">
            <tr>
                <th>Dry</th>
                <th>Fresh</th>
                <th>Cab</th>
                <th>Bo</th>
            </tr>
            <tr>
                <td><input type="number" id="quick_qty_dry" placeholder="" oninput="syncVal('qty_dry', this.value)"></td>
                <td><input type="number" id="quick_qty_fresh" placeholder="" oninput="syncVal('qty_fresh', this.value)"></td>
                <td><input type="number" id="quick_qty_cab" placeholder="" oninput="syncVal('qty_cab', this.value)"></td>
                <td><input type="number" id="quick_qty_bo" placeholder="" oninput="syncVal('qty_bo', this.value)"></td>
            </tr>
        </table>
    </div>
    
    <div class="bottom-m-panel">
        <button class="bottom-m-btn" onclick="triggerParentMPlus()">M+</button>
    </div>
</div>

<script>
window.onload = function() {
    ['qty_dry', 'qty_fresh', 'qty_cab', 'qty_bo'].forEach(id => {
        let val = localStorage.getItem('order_' + id);
        if(val !== null) {
            let el = document.getElementById('quick_' + id);
            if(el) el.value = val;
        }
    });
};

function syncVal(targetKey, val) {
    localStorage.setItem('order_' + targetKey, val);
    let quickEl = document.getElementById('quick_' + targetKey);
    if(quickEl) quickEl.value = val;
}

function triggerParentMPlus() {
    if(window.parent && window.parent.memoryAdd) {
        window.parent.memoryAdd();
    }
}

window.addEventListener('storage', (e) => {
    if(e.key && e.key.startsWith('order_qty_')) {
        let shortId = e.key.replace('order_', '');
        let el = document.getElementById('quick_' + shortId);
        if(el && e.newValue !== null) el.value = e.newValue;
        if(e.newValue === '') {
            ['quick_qty_dry', 'quick_qty_fresh', 'quick_qty_cab', 'quick_qty_bo'].forEach(qid => {
                let qEl = document.getElementById(qid);
                if(qEl) qEl.value = '';
            });
        }
    }
});
</script>

</body>
</html>
