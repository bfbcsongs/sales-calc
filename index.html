<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Miki Ledger & Calculator</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    overscroll-behavior: none;
    touch-action: pan-x pan-y;
}

.main-wrapper {
    padding: 8px;
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
}

/* SESSION & ACTIVE FILE HEADER */
.session-bar {
    background: #1e293b;
    color: white;
    padding: 8px 10px;
    border-radius: 6px 6px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    border: 1px solid #cbd5e1;
    border-bottom: none;
}

.session-info {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: bold;
}

.btn-group {
    display: flex;
    gap: 4px;
}

.btn-sm {
    padding: 4px 8px;
    font-size: 11px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

.btn-edit { background: #3b82f6; color: white; }
.btn-del { background: #ef4444; color: white; }
.save-btn { background: #10b981; color: white; }
.clear-btn { background: #f59e0b; color: white; }

/* TABLE CONTAINERS */
.table-box {
    width: 100%;
    margin: 0;
    background: white;
    border: 1px solid #cbd5e1;
    overflow-x: auto;
}

.table-box-margin {
    margin-bottom: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th, td {
    border: 1px solid #cbd5e1;
    height: 25px; 
    padding: 1px 2px;
    text-align: center;
    vertical-align: middle;
}

th {
    background: #0f172a;
    color: white;
    font-size: 10px;
    font-weight: bold;
}

td {
    background: white;
    font-size: 11px;
}

.table1-header {
    background: #1e3a8a !important;
    color: white !important;
}

.colln-header {
    background: #f59e0b !important;
    color: #000000 !important;
}

table input {
    width: 100%;
    height: 23px;
    padding: 1px 2px;
    border: 1px solid #9ca3af;
    border-radius: 2px;
    text-align: center;
    font-size: 11px;
    background: white;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
}

table input.name-input {
    text-align: left;
    padding-left: 4px;
}

table input.readonly-col {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    font-weight: bold;
}

table input.colln-input {
    background: #fef3c7 !important;
    border: 1px solid #f59e0b !important;
    font-weight: bold;
}

.net-total-red {
    font-weight: bold;
    color: #dc2626;
    font-size: 10px;
    padding: 0 1px;
}

/* GREEN SLIDER TOGGLE BAR */
.slider-toggle-bar {
    width: 100%;
    height: 22px;
    background: #059669;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    border: 1px solid #047857;
    border-top: none;
    border-radius: 0 0 6px 6px;
    margin-bottom: 6px;
    transition: background-color 0.2s ease;
}

.slider-toggle-bar:hover {
    background: #10b981;
}

.slider-pill {
    width: 40px;
    height: 4px;
    background: white;
    border-radius: 2px;
}

.slider-icon {
    font-size: 10px;
    font-weight: bold;
    margin-left: 8px;
}

/* EXPANDABLE SUB-TABLE */
.expandable-table-container {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease-out;
    background: white;
    border: 1px solid #cbd5e1;
    margin-bottom: 10px;
    border-radius: 4px;
}

.expandable-table-container.open {
    max-height: 300px;
}

.sub-table th {
    background: #1f2937;
    font-size: 9px;
    cursor: pointer;
}

.disabled-cell {
    background: #e2e8f0;
}

/* RED HIGHLIGHTED OVERALL TOTAL ROW */
.overall-total-cell {
    background: #fef2f2 !important;
    border: 1.5px solid #ef4444 !important;
}

.overall-total-cell input {
    background: #fee2e2 !important;
    color: #dc2626 !important;
    font-weight: bold !important;
    font-size: 11px !important;
    border: 1px solid #f87171 !important;
}

/* HISTORY SECTION */
.history-section {
    background: white;
    border: 1px solid #cbd5e1;
    margin-top: 8px;
    padding: 10px;
    border-radius: 6px;
}

.history-title {
    font-weight: bold;
    font-size: 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    color: #1e293b;
}

.history-list {
    max-height: 140px;
    overflow-y: auto;
    font-size: 11px;
}

.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 4px;
    border-bottom: 1px solid #f1f5f9;
}
</style>
</head>

<body>

<div class="main-wrapper">

    <!-- Active Session Header -->
    <div class="session-bar">
        <div class="session-info">
            <span id="displayFileDate">Date: -- | --</span>
            <span>|</span>
            <span id="displayFileName">paul</span>
        </div>
        <div class="btn-group">
            <button class="btn-sm save-btn" onclick="saveCurrentDay()">Save Day</button>
            <button class="btn-sm clear-btn" onclick="startNewDay()">New Day</button>
        </div>
    </div>

    <!-- TABLE 1 (VERY FIRST TABLE - INPUT BREAKDOWN PANEL) -->
    <div class="table-box table-box-margin">
        <table id="table1Breakdown">
            <colgroup>
                <col style="width: 25%;">
                <col style="width: 25%;">
                <col style="width: 25%;">
                <col style="width: 25%;">
            </colgroup>
            <thead>
                <tr>
                    <th class="table1-header">Dry</th>
                    <th class="table1-header">Fresh</th>
                    <th class="table1-header">Cab</th>
                    <th class="table1-header">BO</th>
                </tr>
            </thead>
            <tbody id="table1Body">
                <!-- Rows auto-generated by JS -->
            </tbody>
        </table>
    </div>

    <!-- MAIN TABLE 2 (9 COLUMNS LEDGER) -->
    <div class="table-box">
        <table id="mainLedgerTable">
            <colgroup>
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 15%;">
                <col style="width: 15%;">
            </colgroup>
            <thead>
                <tr>
                    <th id="mainLockHeader" onclick="handleMainHeaderTap()">🔒</th>
                    <th>Dry</th>
                    <th>Fresh</th>
                    <th>Cab</th>
                    <th>BO</th>
                    <th>Bal</th>
                    <th>Billing</th>
                    <th class="colln-header">Coll'n</th>
                    <th>Utang</th>
                </tr>
            </thead>
            <tbody id="mainTableBody">
                <!-- Rows 1 to 15 auto-generated by JavaScript -->
            </tbody>
            <tfoot>
                <tr>
                    <td style="color: #dc2626; font-size: 9px; font-weight: bold; text-align: left;">NET TOTAL</td>
                    <td class="net-total-red" id="net_dry">0</td>
                    <td class="net-total-red" id="net_fresh">0</td>
                    <td class="net-total-red" id="net_cab">0</td>
                    <td class="net-total-red" id="net_bo">0</td>
                    <td class="net-total-red" id="net_bal">0</td>
                    <td class="net-total-red" id="net_billing">0</td>
                    <td class="net-total-red" id="net_colln">0</td>
                    <td class="net-total-red" id="net_utang">0</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- TINY GREEN SLIDER BAR -->
    <div class="slider-toggle-bar" id="sliderToggle" onclick="toggleSubTable()">
        <div class="slider-pill"></div>
        <span class="slider-icon" id="sliderIcon">▼ Tap to Open Sub-Table</span>
    </div>

    <!-- EXPANDABLE SUB-TABLE -->
    <div class="expandable-table-container" id="expandableContainer">
        <table class="sub-table">
            <colgroup>
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 10%;">
                <col style="width: 15%;">
                <col style="width: 15%;">
            </colgroup>
            <thead>
                <tr>
                    <th id="subItemHeader1" onclick="handleSubHeaderTap()">Item 🔒</th>
                    <th>Amt</th>
                    <th id="subItemHeader2" onclick="handleSubHeaderTap()">Item 🔒</th>
                    <th>Amt</th>
                    <th>Summary</th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <!-- Row 1 -->
                <tr>
                    <td><input type="text" class="sub-item-input" value="Item 1" readonly style="background-color: #e2e8f0;"></td>
                    <td><input type="number" id="sub_amt1_1" class="sub-amt-input" oninput="calculateSubTable()"></td>
                    <td><input type="text" class="sub-item-input" value="Item 7" readonly style="background-color: #e2e8f0;"></td>
                    <td><input type="number" id="sub_amt2_1" class="sub-amt-input" oninput="calculateSubTable()"></td>
                    <td><input type="text" id="sub_sum_total" class="readonly-col" readonly placeholder="Sum"></td>
                    <td class="disabled-cell"></td><td class="disabled-cell"></td><td class="disabled-cell"></td><td class="disabled-cell"></td>
                </tr>
                <!-- Row 2 -->
                <tr>
                    <td><input type="text" class="sub-item-input" value="Item 2" readonly style="background-color: #e2e8f0;"></td>
                    <td><input type="number" id="sub_amt1_2" class="sub-amt-input" oninput="calculateSubTable()"></td>
                    <td><input type="text" class="sub-item-input" value="Item 8" readonly style="background-color: #e2e8f0;"></td>
                    <td><input type="number" id="sub_amt2_2" class="sub-amt-input" oninput="calculateSubTable()"></td>
                    <td><input type="text" id="sub_net_bal" class="readonly-col" readonly placeholder="Bal"></td>
                    <td class="disabled-cell"></td><td class="disabled-cell"></td><td class="disabled-cell"></td><td class="disabled-cell"></td>
                </tr>
                <!-- Row 3 -->
                <tr>
                    <td><input type="text" class="sub-item-input" value="Item 3" readonly style="background-color: #e2e8f0;"></td>
                    <td><input type="number" id="sub_amt1_3" class="sub-amt-input" oninput="calculateSubTable()"></td>
                    <td><input type="text" class="sub-item-input" value="Item 9" readonly style="background-color: #e2e8f0;"></td>
                    <td><input type="number" id="sub_amt2_3" class="sub-amt-input" oninput="calculateSubTable()"></td>
                    <td><input type="number" id="sub_coh_input" placeholder="COH" oninput="calculateSubTable()"></td>
                    <td class="disabled-cell"></td><td class="disabled-cell"></td><td class="disabled-cell"></td><td class="disabled-cell"></td>
                </tr>
                <!-- Row 4 -->
                <tr>
                    <td><input type="text" class="sub-item-input" value="Item 4" readonly style="background-color: #e2e8f0;"></td>
                    <td><input type="number" id="sub_amt1_4" class="sub-amt-input" oninput="calculateSubTable()"></td>
                    <td><input type="text" class="sub-item-input" value="Item 10" readonly style="background-color: #e2e8f0;"></td>
                    <td><input type="number" id="sub_amt2_4" class="sub-amt-input" oninput="calculateSubTable()"></td>
                    <td class="overall-total-cell"><input type="text" id="sub_overall_total" readonly placeholder="Overall"></td>
                    <td class="disabled-cell"></td><td class="disabled-cell"></td><td class="disabled-cell"></td><td class="disabled-cell"></td>
                </tr>
                <!-- Row 5 -->
                <tr>
                    <td><input type="text" class="sub-item-input" value="Item 5" readonly style="background-color: #e2e8f0;"></td>
                    <td><input type="number" id="sub_amt1_5" class="sub-amt-input" oninput="calculateSubTable()"></td>
                    <td><input type="text" class="sub-item-input" value="Item 11" readonly style="background-color: #e2e8f0;"></td>
                    <td><input type="number" id="sub_amt2_5" class="sub-amt-input" oninput="calculateSubTable()"></td>
                    <td class="disabled-cell"></td>
                    <td class="disabled-cell"></td><td class="disabled-cell"></td><td class="disabled-cell"></td><td class="disabled-cell"></td>
                </tr>
                <!-- Row 6 -->
                <tr>
                    <td><input type="text" class="sub-item-input" value="Item 6" readonly style="background-color: #e2e8f0;"></td>
                    <td><input type="number" id="sub_amt1_6" class="sub-amt-input" oninput="calculateSubTable()"></td>
                    <td><input type="text" class="sub-item-input" value="Item 12" readonly style="background-color: #e2e8f0;"></td>
                    <td><input type="number" id="sub_amt2_6" class="sub-amt-input" oninput="calculateSubTable()"></td>
                    <td class="disabled-cell"></td>
                    <td class="disabled-cell"></td><td class="disabled-cell"></td><td class="disabled-cell"></td><td class="disabled-cell"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- SAVED FILES HISTORY SECTION -->
    <div class="history-section">
        <div class="history-title">
            <span>Saved Files (30-Day History)</span>
            <span id="historyCount" style="color: #64748b; font-size: 11px;">0 / 30</span>
        </div>
        <div class="history-list" id="historyContainer">
            <!-- Saved files loaded dynamically -->
        </div>
    </div>

</div>
<script>
// SUB-TABLE SLIDER TOGGLE
function toggleSubTable() {
    const container = document.getElementById("expandableContainer");
    const icon = document.getElementById("sliderIcon");

    if (container.classList.contains("open")) {
        container.classList.remove("open");
        icon.textContent = "▼ Tap to Open Sub-Table";
    } else {
        container.classList.add("open");
        icon.textContent = "▲ Tap to Close Sub-Table";
    }
}

// 5-TAP HEADER LOCK / UNLOCK FOR SUB-TABLE
let subTapCount = 0;
let subTapTimer = null;
let isSubItemsLocked = true;

function handleSubHeaderTap() {
    subTapCount++;
    clearTimeout(subTapTimer);
    subTapTimer = setTimeout(() => {
        subTapCount = 0;
    }, 1000);

    if (subTapCount >= 5) {
        subTapCount = 0;
        isSubItemsLocked = !isSubItemsLocked;
        toggleSubItemLock(isSubItemsLocked);
    }
}

function toggleSubItemLock(locked) {
    const h1 = document.getElementById("subItemHeader1");
    const h2 = document.getElementById("subItemHeader2");
    const label = locked ? "Item 🔒" : "Item 🔑";
    h1.textContent = label;
    h2.textContent = label;

    const itemInputs = document.querySelectorAll(".sub-item-input");
    itemInputs.forEach(input => {
        input.readOnly = locked;
        input.style.backgroundColor = locked ? "#e2e8f0" : "white";
    });
}

// SUB-TABLE AUTOMATIC CALCULATIONS
function calculateSubTable() {
    let sumAmounts = 0;

    // Compute Sum of Column 2 (Rows 1-6) + Column 4 (Rows 1-6)
    for (let r = 1; r <= 6; r++) {
        const val1 = parseFloat(document.getElementById(`sub_amt1_${r}`).value) || 0;
        const val2 = parseFloat(document.getElementById(`sub_amt2_${r}`).value) || 0;
        sumAmounts += val1 + val2;
    }

    // Row 1: Sum of All Amounts
    document.getElementById("sub_sum_total").value = sumAmounts !== 0 ? sumAmounts.toLocaleString() : "";

    // Row 2: Net Balance (Net Total minus Sum)
    const netUtangElem = document.getElementById("net_utang");
    const mainNetTotal = parseFloat(netUtangElem ? netUtangElem.textContent.replace(/,/g, '') : 0) || 0;
    const netBal = mainNetTotal - sumAmounts;
    document.getElementById("sub_net_bal").value = (mainNetTotal !== 0 || sumAmounts !== 0) ? netBal.toLocaleString() : "";

    // Row 3 & 4: COH Input and Red Highlighted Overall Total
    const cohInputElem = document.getElementById("sub_coh_input");
    const cohVal = parseFloat(cohInputElem.value) || 0;
    const hasCohInput = cohInputElem.value.trim() !== "";

    if (hasCohInput || (mainNetTotal !== 0 || sumAmounts !== 0)) {
        const overallTotal = cohVal - netBal;
        document.getElementById("sub_overall_total").value = overallTotal.toLocaleString();
    } else {
        document.getElementById("sub_overall_total").value = "";
    }
}

// RENDER TABLE 1 (VERY FIRST BREAKDOWN TABLE)
function renderTable1Rows() {
    const tbody = document.getElementById("table1Body");
    if (!tbody) return;

    let rowsHtml = "";
    for (let i = 1; i <= 5; i++) {
        rowsHtml += `
            <tr>
                <td><input type="number" class="t1-dry" oninput="calculateTable1AndLedger()"></td>
                <td><input type="number" class="t1-fresh" oninput="calculateTable1AndLedger()"></td>
                <td><input type="number" class="t1-cab" oninput="calculateTable1AndLedger()"></td>
                <td><input type="number" class="t1-bo" oninput="calculateTable1AndLedger()"></td>
            </tr>
        `;
    }
    tbody.innerHTML = rowsHtml;
}

// RENDER MAIN TABLE 2 (9-COLUMN LEDGER)
function renderMainTableRows() {
    const tbody = document.getElementById("mainTableBody");
    if (!tbody) return;

    let rowsHtml = "";
    for (let i = 1; i <= 15; i++) {
        rowsHtml += `
            <tr>
                <td><input type="text" class="name-input" readonly value="Customer ${i}" style="background-color: #e2e8f0;"></td>
                <td><input type="number" class="t2-dry readonly-col" readonly></td>
                <td><input type="number" class="t2-fresh readonly-col" readonly></td>
                <td><input type="number" class="t2-cab readonly-col" readonly></td>
                <td><input type="number" class="t2-bo readonly-col" readonly></td>
                <td><input type="number" class="t2-bal readonly-col" readonly></td>
                <td><input type="number" class="t2-billing readonly-col" readonly></td>
                <td><input type="number" class="t2-colln colln-input" oninput="calculateTable1AndLedger()"></td>
                <td><input type="number" class="t2-utang readonly-col" readonly></td>
            </tr>
        `;
    }
    tbody.innerHTML = rowsHtml;
}

// GLOBAL CALCULATION ROUTINE FOR TABLE 1, TABLE 2, AND SUB-TABLE
function calculateTable1AndLedger() {
    // 1. Calculate Totals from Table 1 inputs
    let totalDry = 0, totalFresh = 0, totalCab = 0, totalBo = 0;

    document.querySelectorAll(".t1-dry").forEach(inp => totalDry += parseFloat(inp.value) || 0);
    document.querySelectorAll(".t1-fresh").forEach(inp => totalFresh += parseFloat(inp.value) || 0);
    document.querySelectorAll(".t1-cab").forEach(inp => totalCab += parseFloat(inp.value) || 0);
    document.querySelectorAll(".t1-bo").forEach(inp => totalBo += parseFloat(inp.value) || 0);

    // Update Net Total Row in Main Table
    document.getElementById("net_dry").textContent = totalDry !== 0 ? totalDry.toLocaleString() : "0";
    document.getElementById("net_fresh").textContent = totalFresh !== 0 ? totalFresh.toLocaleString() : "0";
    document.getElementById("net_cab").textContent = totalCab !== 0 ? totalCab.toLocaleString() : "0";
    document.getElementById("net_bo").textContent = totalBo !== 0 ? totalBo.toLocaleString() : "0";

    const overallBilling = totalDry + totalFresh + totalCab + totalBo;
    document.getElementById("net_billing").textContent = overallBilling !== 0 ? overallBilling.toLocaleString() : "0";

    // 2. Calculate Collection and Utang Columns
    let totalColln = 0;
    document.querySelectorAll(".t2-colln").forEach(inp => {
        totalColln += parseFloat(inp.value) || 0;
    });
    document.getElementById("net_colln").textContent = totalColln !== 0 ? totalColln.toLocaleString() : "0";

    const overallUtang = overallBilling - totalColln;
    document.getElementById("net_utang").textContent = overallUtang !== 0 ? overallUtang.toLocaleString() : "0";

    // 3. Trigger Sub-Table Auto-Computation
    calculateSubTable();
}

// HISTORY & LOCALSTORAGE HELPERS
function loadHistory() {
    const historyContainer = document.getElementById("historyContainer");
    const historyCount = document.getElementById("historyCount");
    if (!historyContainer) return;

    const saved = JSON.parse(localStorage.getItem("miki_saved_files") || "[]");
    historyCount.textContent = `${saved.length} / 30`;

    if (saved.length === 0) {
        historyContainer.innerHTML = '<div style="color:#94a3b8; text-align:center; padding:10px;">No saved history yet</div>';
        return;
    }

    let html = "";
    saved.forEach((item, index) => {
        html += `
            <div class="history-item">
                <span>${item.date} - ${item.name}</span>
                <div>
                    <button class="btn-sm btn-edit" onclick="loadSavedFile(${index})">Edit</button>
                    <button class="btn-sm btn-del" onclick="deleteSavedFile(${index})">Del</button>
                </div>
            </div>
        `;
    });
    historyContainer.innerHTML = html;
}

function saveCurrentDay() {
    const saved = JSON.parse(localStorage.getItem("miki_saved_files") || "[]");
    const today = new Date().toISOString().split('T')[0];
    
    saved.unshift({
        date: today,
        name: "paul"
    });

    if (saved.length > 30) saved.pop();

    localStorage.setItem("miki_saved_files", JSON.stringify(saved));
    loadHistory();
    alert("Saved successfully!");
}

function startNewDay() {
    if (confirm("Start new day? Unsaved changes will be cleared.")) {
        document.querySelectorAll("input[type='number']").forEach(i => i.value = "");
        calculateTable1AndLedger();
    }
}

// INITIALIZE ON LOAD
window.addEventListener("DOMContentLoaded", () => {
    renderTable1Rows();
    renderMainTableRows();
    loadHistory();
    calculateTable1AndLedger();
});
</script>

</body>
</html>
